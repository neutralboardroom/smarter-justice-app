# Existing-service reference. Validate against the Render workspace before creating or syncing a Blueprint.
# The plan is intentionally omitted so Render retains the current instance type for the existing service.
services:
  - type: web
    name: smarter-justice-app
    runtime: node
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    numInstances: 1
    healthCheckPath: /livez
    region: oregon
    branch: main
    domains:
      - smarterjustice.com
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: OWNER_ACCOUNT_NAME
        sync: false
      - key: OWNER_ACCOUNT_EMAIL
        sync: false
      - key: OWNER_ACCOUNT_PASSWORD
        sync: false
      - key: OWNER_SESSION_HOURS
        value: "8"
      - key: ALLOW_LEGACY_OWNER_TOKEN
        value: "false"
      - key: APP_BASE_URL
        sync: false
      - key: OWNER_CONTROL_CENTER_TOKEN
        sync: false
      - key: PORTAL_RULES_API_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ALLOW_ADMIN_TOKEN_QUERY
        value: "false"
      - key: STAFF_SIGNUP_CODE
        sync: false
      - key: STAFF_SESSION_HOURS
        value: "8"
      - key: PROFESSIONAL_SESSION_DAYS
        value: "14"
      - key: CONTINUATION_TOKEN_DAYS
        value: "180"
      - key: TRUST_PROXY
        value: "true"
      - key: SENSITIVE_TRAFFIC_APPROVED
        value: "false"
      - key: PROFESSIONAL_PILOT_ACTIVATION_APPROVED
        value: "false"
      - key: PUBLIC_PAID_SERVICES_ENABLED
        value: "false"
      - key: STOP_SIGN_PROJECT_DESTINATION_VERIFIED
        value: "false"
      - key: AI_REVIEW_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PG_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: SMARTER_JUSTICE_STORAGE_DIR
        sync: false
      - key: RENDER_DISK_MOUNT_PATH
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TAWK_PROPERTY_ID
        sync: false
      - key: TAWK_WIDGET_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_TOLERANCE_SECONDS
        value: "300"
      - key: STRIPE_STARTER_REVIEW_PRICE_ID
        sync: false
      - key: STRIPE_NOTICE_REVIEW_PRICE_ID
        sync: false
      - key: STRIPE_FORM_PREP_PRICE_ID
        sync: false
      - key: STRIPE_TAX_REVIEW_PRICE_ID
        sync: false
      - key: STRIPE_ATTORNEY_REVIEW_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_REVIEW_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_REVIEW_PREP_PRICE_ID
        sync: false
      - key: MAX_UPLOADS_PER_REQUEST
        sync: false
      - key: MAX_UPLOAD_BYTES
        sync: false

# OpenAI-only central AI gateway. Add these only to the Smarter Justice central
# service. All capability flags remain dark until exact live acceptance passes.
# OPENAI_AI_ENABLED=false
# AI_GLOBAL_KILL_SWITCH=true
# AI_COST_HARD_STOP=false
# AI_PORTAL_SMARTER_JUSTICE_CENTRAL_ENABLED=true
# AI_TOOL_SJ_STARTING_POINT_ENABLED=false
# AI_GATEWAY_CONTRACT_VERSION=sj-ai-gateway-v1.0.0
# OPENAI_API_KEY=                # protected secret; never sync or commit
# OPENAI_PROJECT_ID=
# OPENAI_SERVICE_ACCOUNT_ID=
# OPENAI_MODEL=gpt-5-mini
# OPENAI_REQUEST_TIMEOUT_MS=12000
# OPENAI_MAX_OUTPUT_TOKENS=900
# OPENAI_STORE_RESPONSES=false
# AI_DAILY_REQUEST_HARD_STOP=250
# AI_MONTHLY_ESTIMATED_USD_HARD_STOP=100
# AI_PORTAL_SERVICE_TOKENS_JSON={}  # protected server-to-server secrets

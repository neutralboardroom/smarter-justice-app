name: PRE126 hyperlocal legal-community qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pre126-qualification.yml'
      - '.github/workflows/production-qualification.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/bootstrap-pre125-release.js'
      - 'scripts/bootstrap-pre126-release.js'
      - 'scripts/start-pre126-deploy.js'
      - 'deployment/pre126/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current Smarter Justice authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Verify bootstrap package identity
        run: |
          root_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          test "$root_version" = "$lock_version"
          case "$root_version" in
            2.0.0-pre126|2.0.0-pre127) ;;
            *) echo "Unsupported bootstrap version for retained PRE126 qualification: $root_version"; exit 1 ;;
          esac

      - name: Install and construct exact runtime
        env:
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Reconstruct a second time
        run: node scripts/bootstrap-pre126-release.js

      - name: Syntax-check release code
        run: |
          node --check scripts/bootstrap-pre125-release.js
          node --check scripts/bootstrap-pre126-release.js
          node --check scripts/start-pre126-deploy.js
          node --check deployment/pre126/overlay/data/legalCommunityNetworkPre126.js
          node --check deployment/pre126/overlay/lib/legalCommunityNetworkPre126.js
          node --check deployment/pre126/overlay/lib/legalCommunityMembershipPre126.js
          node --check deployment/pre126/overlay/public/pre126-community.js
          node --check .runtime/pre126-live/server.js

      - name: Run community, release, and deployment qualification
        working-directory: .runtime/pre126-live
        run: |
          npm test
          npm run deployment:doctor
          npm run deployment:validate

      - name: Verify exact product, pricing, provider, and rollback boundaries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const root='.runtime/pre126-live';
          const marker=JSON.parse(fs.readFileSync(`${root}/.pre126-render-bootstrap.json`,'utf8'));
          const receipt=JSON.parse(fs.readFileSync(`${root}/PRE126_COMPLETION_RECEIPT.json`,'utf8'));
          if(marker.release!=='v2.0.0-pre126'||marker.baseRelease!=='v2.0.0-pre125'||marker.productAuthority!=='SMARTER_JUSTICE_ONLY'||marker.legalCommunityNetworkMutation!==true||marker.homepageAndVisualDirectionAuthorized!==true||marker.oneConnectedDomainAndBrand!==true||marker.newStripeSetup!==false||marker.newStripeProviderMutation!==false||marker.environmentVariableMutation!==false||marker.productionDeploymentAuthorized!==true) process.exit(1);
          if(receipt.noLossFromPredecessor!==true||receipt.predecessorUnchangedFilesHashVerified!==true||receipt.rollbackCommit!=='2e4b90c083c469bc0e055747258fc9521eed06b2'||receipt.pricingAmountsChanged!==false||receipt.newStripeSetup!==false||receipt.privateMatterCommunityFeed!==false||receipt.unsolicitedOutreachAutomation!==false||receipt.restoredOwnerRuntimeDependencies!==true||receipt.retainedSecurityRegressionSuites!==true) process.exit(1);
          console.log(JSON.stringify({release:marker.release,baseRelease:marker.baseRelease,launchCommunity:receipt.launchCommunity,prices:receipt.pricesPreserved,newStripeSetup:receipt.newStripeSetup,rollbackCommit:receipt.rollbackCommit},null,2));
          NODE

      - name: Build exact deterministic handoff
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('.runtime/pre126-live')
          out=pathlib.Path('SMARTER_JUSTICE__V2.0.0-PRE126__HYPERLOCAL_LEGAL_COMMUNITIES__DOWNTOWN_BROOKLYN__PRICES_PRESERVED__NO_NEW_STRIPE_SETUP__2026-09-01.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  info=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(2026,9,1,12,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644 << 16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path(out.name+'.sha256.txt').write_text(f'{digest}  {out.name}\n')
          receipt=json.loads((root/'PRE126_COMPLETION_RECEIPT.json').read_text())
          receipt['exactHandoffZip']={'fileName':out.name,'sha256':digest,'sizeBytes':out.stat().st_size}
          pathlib.Path('PRE126_EXACT_HANDOFF_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt['exactHandoffZip'],indent=2))
          PY

      - name: Upload exact handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-pre126-exact-handoff
          path: |
            SMARTER_JUSTICE__V2.0.0-PRE126__HYPERLOCAL_LEGAL_COMMUNITIES__DOWNTOWN_BROOKLYN__PRICES_PRESERVED__NO_NEW_STRIPE_SETUP__2026-09-01.zip
            SMARTER_JUSTICE__V2.0.0-PRE126__HYPERLOCAL_LEGAL_COMMUNITIES__DOWNTOWN_BROOKLYN__PRICES_PRESERVED__NO_NEW_STRIPE_SETUP__2026-09-01.zip.sha256.txt
            PRE126_EXACT_HANDOFF_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

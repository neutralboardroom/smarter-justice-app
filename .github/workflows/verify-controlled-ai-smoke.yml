name: Diagnose pre42 Render receipt

on:
  push:
    branches: [pre42-render-projection-build]
    paths:
      - '.github/workflows/verify-controlled-ai-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-pre42-render-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch redacted pre42 receipt without exposing secrets
        run: |
          set -euo pipefail
          url='https://smarter-justice-app.onrender.com/.well-known/smarter-justice-pre42-deployment.json'
          code="$(curl --silent --show-error --max-time 20 -o /tmp/body -w '%{http_code}' "$url" || true)"
          echo "HTTP_STATUS=$code"
          echo '--- REDACTED BODY ---'
          cat /tmp/body || true
          echo
          echo '--- END BODY ---'

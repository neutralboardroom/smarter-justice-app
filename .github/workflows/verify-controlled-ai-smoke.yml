name: Verify controlled Smarter Justice AI smoke

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/run-controlled-openai-smoke.js'
      - 'scripts/apply-controlled-ai-smoke-status.js'
      - '.github/workflows/verify-controlled-ai-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-controlled-ai-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and require redacted PASS receipt
        run: |
          set -euo pipefail
          url='https://smarter-justice-app.onrender.com/.well-known/smarter-justice-ai-smoke.json'
          for attempt in $(seq 1 30); do
            echo "Attempt $attempt"
            if body="$(curl --fail --silent --show-error --max-time 20 "$url" 2>/dev/null)"; then
              echo "$body" > /tmp/ai-smoke.json
              if node - <<'NODE'
          const fs=require('fs');
          const row=JSON.parse(fs.readFileSync('/tmp/ai-smoke.json','utf8'));
          if(row.status!=='PASS')process.exit(1);
          if(row.provider!=='openai')process.exit(1);
          if(row.publicAiEnabled!==false)process.exit(1);
          if(row.secretExposed!==false)process.exit(1);
          if(typeof row.checkedAt!=='string'||!row.checkedAt)process.exit(1);
          console.log(JSON.stringify(row,null,2));
          NODE
              then
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Controlled AI smoke did not reach PASS within the verification window.' >&2
          exit 1

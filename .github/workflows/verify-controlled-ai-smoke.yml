name: Diagnose current pre42 Render receipt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-controlled-ai-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-current-pre42-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current redacted receipt and retain strict acceptance
        run: |
          set -euo pipefail
          url='https://smarter-justice-app.onrender.com/.well-known/smarter-justice-pre42-deployment.json'
          code="$(curl --silent --show-error --max-time 20 -o /tmp/pre42.json -w '%{http_code}' "$url" || true)"
          echo "HTTP_STATUS=$code"
          echo '--- REDACTED RECEIPT ---'
          cat /tmp/pre42.json || true
          echo
          echo '--- END RECEIPT ---'
          test "$code" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const row=JSON.parse(fs.readFileSync('/tmp/pre42.json','utf8'));
          const exact='9956c52237ebc09bb6e4474c7c0a9863af6d952cabc3e030ee42942cc75cc4f5';
          if(row.status!=='PASS'||row.pre42ArtifactSha256!==exact)process.exit(1);
          if(row.providerCanary!=='PASS'||row.usageLedgerRecorded!==true)process.exit(1);
          if(row.allowanceNegativeTest!=='PASS'||row.providerFailurePath!=='PASS')process.exit(1);
          if(row.navigatorIsolation!=='PASS'||row.navigatorConfirmationGate!=='PASS')process.exit(1);
          if(row.browserSecretScan!=='PASS'||row.publicAiEnabled!==false||row.secretExposed!==false)process.exit(1);
          NODE

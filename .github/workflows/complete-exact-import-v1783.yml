name: Complete exact Smarter Justice v1.7.83 import

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/complete-exact-import-v1783.yml'
      - 'smarter-justice-v1.7.83*.zip'

permissions:
  contents: write
  actions: read

concurrency:
  group: smarter-justice-v1783-complete-import
  cancel-in-progress: false

jobs:
  complete-exact-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated import branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/v1.7.83-production-import-protected-deploy
          fetch-depth: 0

      - name: Verify exact archive and source inventory
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -maxdepth 1 -type f -name 'smarter-justice-v1.7.83*.zip' -print | sort)
          test "${#files[@]}" -eq 1
          archive="${files[0]}"
          test "$(stat -c%s "$archive")" = "8888322"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "41eff94948e36b79ff5cf7e5d2b25c9bf145935cad5980c034c0b39254d4dbfc"
          stage="$RUNNER_TEMP/smarter-justice-v1.7.83-source"
          rm -rf "$stage"
          mkdir -p "$stage"
          python3 - "$archive" "$stage" <<'PY'
          import hashlib, json, pathlib, stat, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          stage = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              names = [i.filename for i in infos]
              assert len(names) == len(set(names)) == 3171
              assert sum(not i.is_dir() for i in infos) == 3147
              assert sum(i.is_dir() for i in infos) == 24
              for info in infos:
                  p = pathlib.PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK(mode)
              z.extractall(stage)
          package = json.loads((stage / 'package.json').read_text(encoding='utf-8'))
          assert package['version'] == '1.7.83'
          assert "const VERSION = '1.7.83';" in (stage / 'server.js').read_text(encoding='utf-8')
          inventory = stage / 'FILE_INVENTORY_SHA256.txt'
          records = []
          for line in inventory.read_text(encoding='utf-8').splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              expected, rel = line.split('  ', 1)
              records.append((expected, rel))
          assert len(records) == 3146
          assert hashlib.sha256(inventory.read_bytes()).hexdigest() == 'cfbf49c89af963d0ea7d7a9bed25cda3a6a2652e93dc6a8c021b72b9c05d7a8c'
          for expected, rel in records:
              path = stage / rel
              assert path.is_file(), rel
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, rel
          workflow = stage / '.github/workflows/production-qualification.yml'
          assert hashlib.sha256(workflow.read_bytes()).hexdigest() == '8a3aef61d0354e0011e03c916be58ffa780a604da5410582ba17086d93fae62e'
          print('Exact v1.7.83 archive and all inventory records verified.')
          PY
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Commit exact source except protected workflow transition
        env:
          STAGE: ${{ steps.verify.outputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          temp_workflows="$RUNNER_TEMP/current-import-workflows"
          rm -rf "$temp_workflows"
          mkdir -p "$temp_workflows"
          cp -a .github/workflows/. "$temp_workflows/"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$STAGE"/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a "$temp_workflows"/. .github/workflows/
          test "$(node -p "require('./package.json').version")" = "1.7.83"
          test "$(sha256sum FILE_INVENTORY_SHA256.txt | cut -d' ' -f1)" = "cfbf49c89af963d0ea7d7a9bed25cda3a6a2652e93dc6a8c021b72b9c05d7a8c"
          test -z "$(find . -maxdepth 1 -type f -name 'smarter-justice-v1.7.83*.zip' -print -quit)"
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('.')
          checked = 0
          for line in (root / 'FILE_INVENTORY_SHA256.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              expected, rel = line.split('  ', 1)
              if rel == '.github/workflows/production-qualification.yml':
                  continue
              path = root / rel
              assert path.is_file(), rel
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, rel
              checked += 1
          assert checked == 3145
          print('All 3,145 non-workflow inventory records reverified in transitional tree.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing transition because a workflow file changed.'
            git diff --cached --name-status -- .github/workflows
            exit 1
          fi
          git commit -m 'Import exact Smarter Justice v1.7.83 source except protected workflow'
          git push origin HEAD:agent/v1.7.83-production-import-protected-deploy

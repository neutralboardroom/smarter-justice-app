name: One-time v1.7.85 all-approved-portals policy

on:
  push:
    branches:
      - release/v1.7.85-all-portals
    paths:
      - .github/workflows/one-time-v1785-all-portals-policy.yml

permissions:
  contents: write

jobs:
  implement-test-seal-and-remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact protected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/v1.7.85-all-portals
          fetch-depth: 0
          persist-credentials: true

      - name: Implement active all-approved-portals launch policy
        shell: bash
        run: |
          set -euo pipefail
          cat > ALL_APPROVED_PORTAL_LAUNCH_POLICY_V1.7.85.json <<'JSON'
          {
            "schema_id": "SJP-ALL-APPROVED-LEGAL-PORTALS-LAUNCH-POLICY-2026-08-04-V1",
            "releaseVersion": "1.7.85",
            "effective_at": "2026-08-04T16:15:00-04:00",
            "owner_decision": "ALL_APPROVED_LEGAL_MICRO_PORTALS_ONE_COORDINATED_LAUNCH_PORTFOLIO",
            "central_product": {
              "id": "smarter-justice-central",
              "name": "Smarter Justice",
              "role": "PORTFOLIO_COORDINATOR"
            },
            "approved_legal_portals": [
              {"id":"justice-tax-solutions","name":"Justice Tax Solutions","specialty":"Tax preparation and tax resolution"},
              {"id":"estate-law-aid","name":"Estate Law Aid","specialty":"Estate planning, probate and estate administration"},
              {"id":"business-launch-desk","name":"Business Launch Desk","specialty":"Business formation and compliance"},
              {"id":"contract-creator","name":"ContractCreator","specialty":"Contracts and agreement preparation","exact_blocker":"Canonical owned replacement domain remains pending."},
              {"id":"employment-law-aid","name":"Employment Law Aid","specialty":"Employment, wage and workplace matters"},
              {"id":"divorce-law-aid","name":"Divorce Law Aid","specialty":"Divorce and family law"},
              {"id":"landlord-tenant-aid","name":"Housing and Landlord-Tenant Law Aid","specialty":"Housing and landlord-tenant matters"},
              {"id":"real-estate-law-aid","name":"Real Estate Law Aid","specialty":"Real estate transactions and disputes"},
              {"id":"personal-injury-law-aid","name":"Personal Injury Law Aid","specialty":"Personal injury matters"},
              {"id":"car-accident-law-aid","name":"Car Accident Law Aid","specialty":"Vehicle accidents"},
              {"id":"criminal-law-aid","name":"Criminal Law Aid","specialty":"Criminal defense preparation"},
              {"id":"civil-rights-law-aid","name":"Civil Rights and Police Misconduct Law Aid","specialty":"Civil rights and police misconduct"},
              {"id":"disability-law-aid","name":"Disability Law Aid","specialty":"Disability benefits and accommodations"},
              {"id":"workers-compensation-law-aid","name":"Workers’ Compensation Law Aid","specialty":"Workers’ compensation"},
              {"id":"consumer-protection-law-aid","name":"Consumer Protection, Fraud and Scam Law Aid","specialty":"Consumer protection, fraud and scams"},
              {"id":"veterans-law-aid","name":"Veterans Benefits and Military Law Aid","specialty":"Veterans benefits and military law"},
              {"id":"trademark-patent-ip-law-aid","name":"Trademark, Patent and Intellectual Property Law Aid","specialty":"Intellectual property"},
              {"id":"medical-malpractice-law-aid","name":"Medical Malpractice Law Aid","specialty":"Medical malpractice"},
              {"id":"insurance-claim-law-aid","name":"Insurance Claims, Denials and Bad Faith Law Aid","specialty":"Insurance claims and bad faith"},
              {"id":"education-law-aid","name":"Education and Special Education Law Aid","specialty":"Education and special education"},
              {"id":"bankruptcy-debt-law-aid","name":"Bankruptcy and Debt Law Aid","specialty":"Bankruptcy and debt"},
              {"id":"domestic-violence-aid","name":"Domestic Violence Aid","specialty":"Domestic violence preparation and survivor-safe resources","enhanced_safety":true}
            ],
            "separately_governed_products_and_initiatives": [
              {"id":"immigration-oasis","reason":"Separate immigration-only platform and brand."},
              {"id":"coverednyc","reason":"Separate healthcare-coverage identity and licensing boundaries."},
              {"id":"justice-truck","reason":"Field initiative, not an independent legal specialty portal."},
              {"id":"stop-sign-project","reason":"Embedded survivor-safety initiative within Domestic Violence Aid."},
              {"id":"attorneyride","reason":"Professional delivery infrastructure, not a public legal specialty portal."}
            ],
            "binding_rules": {
              "initial_four_or_five_priority_rule": false,
              "independent_product_readiness": true,
              "cross_blocking_between_portals": false,
              "parallel_preparation_allowed": true,
              "production_release_one_product_at_a_time": true,
              "truthful_maturity_differences_allowed": true,
              "exact_artifact_and_verified_readiness_required": true,
              "automatic_sensitive_data_transfer": false,
              "automatic_professional_routing": false,
              "explicit_user_consent_for_cross_portal_handoff": true,
              "minimum_necessary_handoff_only": true,
              "separate_product_brands_domains_repositories_versions": true
            },
            "readiness_states": [
              "EVIDENCE_REQUIRED",
              "BUILDING",
              "EXACT_TESTED",
              "DEPLOYMENT_REVIEW_READY",
              "DEPLOYED_DARK",
              "VERIFIED_LIVE",
              "BLOCKED_WITH_EXACT_REASON",
              "PAUSED"
            ],
            "deployment_authorized": false,
            "production_request_sent": false
          }
          JSON

          cat > lib/allApprovedPortalLaunch.js <<'JS'
          'use strict';
          const crypto=require('crypto');
          const policy=require('../ALL_APPROVED_PORTAL_LAUNCH_POLICY_V1.7.85.json');
          const ALLOWED_STATES=new Set(policy.readiness_states);
          const APPROVED_IDS=Object.freeze(policy.approved_legal_portals.map(x=>x.id));
          const APPROVED_SET=new Set(APPROVED_IDS);
          const SEPARATE_SET=new Set(policy.separately_governed_products_and_initiatives.map(x=>x.id));
          const SECRET_PATTERN=/(?:sk_live_|rk_live_|ghp_|github_pat_|postgres(?:ql)?:\/\/[^"\s]+:[^"\s]+@|BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY)/i;
          const clone=v=>JSON.parse(JSON.stringify(v));
          const text=v=>String(v??'').trim();
          const digest=v=>crypto.createHash('sha256').update(JSON.stringify(v)).digest('hex');
          function validatePolicy(){
            const errors=[];
            if(policy.schema_id!=='SJP-ALL-APPROVED-LEGAL-PORTALS-LAUNCH-POLICY-2026-08-04-V1')errors.push('schema-id');
            if(policy.releaseVersion!=='1.7.85')errors.push('release-version');
            if(policy.owner_decision!=='ALL_APPROVED_LEGAL_MICRO_PORTALS_ONE_COORDINATED_LAUNCH_PORTFOLIO')errors.push('owner-decision');
            if(APPROVED_IDS.length<20)errors.push('approved-portal-coverage');
            if(new Set(APPROVED_IDS).size!==APPROVED_IDS.length)errors.push('duplicate-approved-portal');
            for(const id of ['real-estate-law-aid','landlord-tenant-aid','civil-rights-law-aid','domestic-violence-aid'])if(!APPROVED_SET.has(id))errors.push(`missing-approved:${id}`);
            for(const id of SEPARATE_SET)if(APPROVED_SET.has(id))errors.push(`separate-product-in-launch-set:${id}`);
            const rules=policy.binding_rules||{};
            if(rules.initial_four_or_five_priority_rule!==false)errors.push('obsolete-cohort-priority');
            if(rules.independent_product_readiness!==true||rules.cross_blocking_between_portals!==false)errors.push('independent-readiness');
            if(rules.parallel_preparation_allowed!==true||rules.production_release_one_product_at_a_time!==true)errors.push('release-sequencing');
            if(rules.explicit_user_consent_for_cross_portal_handoff!==true||rules.minimum_necessary_handoff_only!==true)errors.push('handoff-consent');
            if(rules.automatic_sensitive_data_transfer!==false||rules.automatic_professional_routing!==false)errors.push('automatic-transfer-boundary');
            if(SECRET_PATTERN.test(JSON.stringify(policy)))errors.push('secret-material');
            if(policy.deployment_authorized!==false||policy.production_request_sent!==false)errors.push('deployment-boundary');
            return{ok:errors.length===0,errors,approvedPortalCount:APPROVED_IDS.length,policyDigest:digest(policy)};
          }
          function validateReceipt(receipt={}){
            const errors=[];
            const productId=text(receipt.product_id);
            if(!APPROVED_SET.has(productId))errors.push('unapproved-product-id');
            if(!/^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/.test(text(receipt.version)))errors.push('version');
            if(!text(receipt.artifact_name).toLowerCase().endsWith('.zip'))errors.push('artifact-name');
            if(!/^[a-f0-9]{64}$/.test(text(receipt.artifact_sha256)))errors.push('artifact-sha256');
            if(!ALLOWED_STATES.has(receipt.readiness_state))errors.push('readiness-state');
            if(!Array.isArray(receipt.exact_blockers))errors.push('exact-blockers');
            if(receipt.readiness_state==='BLOCKED_WITH_EXACT_REASON'&&!(receipt.exact_blockers||[]).length)errors.push('blocked-without-reason');
            if(receipt.deployment_authorized!==false)errors.push('deployment-authorized');
            if(receipt.production_request_sent!==false)errors.push('production-request-sent');
            if(SECRET_PATTERN.test(JSON.stringify(receipt)))errors.push('secret-material');
            return{ok:errors.length===0,errors,productId,readinessState:text(receipt.readiness_state),receiptDigest:digest(receipt)};
          }
          function aggregate(receipts=[]){
            const rows=[];
            const seen=new Set();
            for(const receipt of Array.isArray(receipts)?receipts:[]){
              const validation=validateReceipt(receipt);
              if(validation.productId&&seen.has(validation.productId))validation.errors.push('duplicate-product-receipt');
              validation.ok=validation.errors.length===0;
              if(validation.productId)seen.add(validation.productId);
              rows.push(validation);
            }
            const valid=rows.filter(x=>x.ok);
            const byId=new Map(valid.map(x=>[x.productId,x]));
            const productStates=policy.approved_legal_portals.map(portal=>{
              const receipt=byId.get(portal.id);
              return{productId:portal.id,productName:portal.name,specialty:portal.specialty,readinessState:receipt?.readinessState||'EVIDENCE_REQUIRED',receiptPresent:Boolean(receipt),exactBlocker:portal.exact_blocker||null};
            });
            const eligible=productStates.filter(x=>['DEPLOYMENT_REVIEW_READY','DEPLOYED_DARK','VERIFIED_LIVE'].includes(x.readinessState));
            const next=productStates.find(x=>!x.receiptPresent)||productStates.find(x=>x.readinessState==='BLOCKED_WITH_EXACT_REASON')||null;
            return{
              schemaId:policy.schema_id,
              releaseVersion:policy.releaseVersion,
              ownerDecision:policy.owner_decision,
              productStates,
              summary:{approvedLegalPortals:APPROVED_IDS.length,suppliedReceipts:rows.length,validReceipts:valid.length,invalidReceipts:rows.length-valid.length,deploymentReviewOrBeyond:eligible.length,evidenceRequired:productStates.filter(x=>x.readinessState==='EVIDENCE_REQUIRED').length},
              independentlyEligibleProductIds:eligible.map(x=>x.productId),
              nextExactAction:next?`Obtain and validate the exact current artifact and readiness receipt for ${next.productName}.`:'Review the independently eligible products and release one exact product at a time.',
              crossBlockingApplied:false,
              missingReceiptInferenceApplied:false,
              initialCohortPriorityApplied:false,
              parallelPreparationAllowed:true,
              productionReleaseOneProductAtATime:true,
              deploymentAuthorized:false,
              productionRequestSent:false
            };
          }
          function ownerView(receipts=[]){return{policy:clone(policy),validation:validatePolicy(),aggregate:aggregate(receipts)};}
          module.exports={APPROVED_IDS,validatePolicy,validateReceipt,aggregate,ownerView};
          JS

          cat > tests/all-approved-portals-launch-v1785.test.js <<'JS'
          'use strict';
          const assert=require('assert');
          const fs=require('fs');
          const path=require('path');
          const launch=require('../lib/allApprovedPortalLaunch');
          const validation=launch.validatePolicy();
          assert.equal(validation.ok,true,validation.errors.join(','));
          assert.ok(validation.approvedPortalCount>=20);
          for(const id of ['real-estate-law-aid','landlord-tenant-aid','civil-rights-law-aid','domestic-violence-aid'])assert.ok(launch.APPROVED_IDS.includes(id),id);
          for(const id of ['immigration-oasis','coverednyc','justice-truck','stop-sign-project','attorneyride'])assert.ok(!launch.APPROVED_IDS.includes(id),id);
          const ready={product_id:'estate-law-aid',version:'1.1.93',artifact_name:'estate-law-aid-v1.1.93.zip',artifact_sha256:'a'.repeat(64),readiness_state:'DEPLOYMENT_REVIEW_READY',exact_blockers:[],deployment_authorized:false,production_request_sent:false};
          const blocked={product_id:'contract-creator',version:'0.53.0',artifact_name:'contractcreator-v0.53.0.zip',artifact_sha256:'b'.repeat(64),readiness_state:'BLOCKED_WITH_EXACT_REASON',exact_blockers:['Canonical owned replacement domain remains pending.'],deployment_authorized:false,production_request_sent:false};
          const aggregate=launch.aggregate([ready,blocked]);
          assert.equal(aggregate.crossBlockingApplied,false);
          assert.equal(aggregate.initialCohortPriorityApplied,false);
          assert.equal(aggregate.parallelPreparationAllowed,true);
          assert.equal(aggregate.productionReleaseOneProductAtATime,true);
          assert.equal(aggregate.deploymentAuthorized,false);
          assert.ok(aggregate.independentlyEligibleProductIds.includes('estate-law-aid'));
          assert.ok(!aggregate.independentlyEligibleProductIds.includes('contract-creator'));
          const server=fs.readFileSync(path.join(__dirname,'..','server.js'),'utf8');
          assert.ok(server.includes("require('./lib/allApprovedPortalLaunch')"));
          assert.ok(server.includes("/api/owner/all-approved-portals-launch"));
          assert.ok(server.includes('allApprovedPortalLaunch:allApprovedPortalLaunch.ownerView()'));
          const pkg=require('../package.json');
          assert.ok(pkg.scripts.test.includes('tests/all-approved-portals-launch-v1785.test.js'));
          console.log('all-approved-portals-launch-v1785.test.js passed');
          JS

          node <<'NODE'
          'use strict';
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const cmd='node tests/all-approved-portals-launch-v1785.test.js';
          if(!pkg.scripts.test.includes(cmd))pkg.scripts.test=`${pkg.scripts.test} && ${cmd}`;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          let server=fs.readFileSync('server.js','utf8');
          if(!server.includes("require('./lib/allApprovedPortalLaunch')"))server=server.replace("const portfolioLaunchReadiness = require('./lib/portfolioLaunchReadiness');","const portfolioLaunchReadiness = require('./lib/portfolioLaunchReadiness');\nconst allApprovedPortalLaunch = require('./lib/allApprovedPortalLaunch');");
          if(!server.includes('allApprovedPortalLaunch:allApprovedPortalLaunch.ownerView()'))server=server.replace('portfolioLaunchReadiness:portfolioLaunchReadiness.ownerView(), providerPreflight:', 'portfolioLaunchReadiness:portfolioLaunchReadiness.ownerView(), allApprovedPortalLaunch:allApprovedPortalLaunch.ownerView(), providerPreflight:');
          if(!server.includes("pathName === '/api/owner/all-approved-portals-launch'"))server=server.replace("  if (req.method === 'GET' && pathName === '/api/owner/provider-preflight') {", "  if (req.method === 'GET' && pathName === '/api/owner/all-approved-portals-launch') {\n    if(!requireOwner(req))return json(res,403,{ok:false,error:'Private owner access is required.'});\n    return json(res,200,{ok:true,appVersion:VERSION,allApprovedPortalLaunch:allApprovedPortalLaunch.ownerView()});\n  }\n  if (req.method === 'GET' && pathName === '/api/owner/provider-preflight') {");
          fs.writeFileSync('server.js',server);
          NODE

          node tests/all-approved-portals-launch-v1785.test.js
          npm test

      - name: Regenerate exact V14 inventories and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          TEMP_ROOT="$(mktemp -d)"
          git archive HEAD | tar -x -C "$TEMP_ROOT"
          rm -f "$TEMP_ROOT/.github/workflows/one-time-v1785-all-portals-policy.yml"
          cp ALL_APPROVED_PORTAL_LAUNCH_POLICY_V1.7.85.json "$TEMP_ROOT/"
          cp lib/allApprovedPortalLaunch.js "$TEMP_ROOT/lib/"
          cp tests/all-approved-portals-launch-v1785.test.js "$TEMP_ROOT/tests/"
          cp package.json server.js "$TEMP_ROOT/"
          cd "$TEMP_ROOT"
          node <<'NODE'
          'use strict';
          const fs=require('fs');const path=require('path');const crypto=require('crypto');const root=process.cwd();
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const walk=()=>{const out=[];(function visit(dir){for(const name of fs.readdirSync(dir).sort((a,b)=>a.localeCompare(b))){const full=path.join(dir,name),rel=path.relative(root,full).split(path.sep).join('/'),st=fs.lstatSync(full);if(st.isSymbolicLink())throw new Error(`symlink:${rel}`);if(st.isDirectory())visit(full);else if(st.isFile())out.push(rel);}})(root);return out;};
          const inventory=exclusions=>{const excluded=new Set(exclusions);return walk().filter(p=>!excluded.has(p)).sort((a,b)=>a.localeCompare(b)).map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`).join('\n')+'\n';};
          const payload=inventory(['OWNER_RECEIPT.txt','RELEASE_PAYLOAD_INVENTORY_SHA256.txt','FILE_INVENTORY_SHA256.txt']);
          fs.writeFileSync('RELEASE_PAYLOAD_INVENTORY_SHA256.txt',payload);
          let owner=fs.readFileSync('OWNER_RECEIPT.txt','utf8');
          owner=owner.replace(/^RELEASE_PAYLOAD_INVENTORY_SHA256:.*$/m,`RELEASE_PAYLOAD_INVENTORY_SHA256: ${sha(Buffer.from(payload))}`);
          owner=owner.replace(/^RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT:.*$/m,`RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT: ${payload.trimEnd().split('\n').filter(Boolean).length}`);
          fs.writeFileSync('OWNER_RECEIPT.txt',owner);
          fs.writeFileSync('FILE_INVENTORY_SHA256.txt',inventory(['FILE_INVENTORY_SHA256.txt']));
          NODE
          node scripts/generate-v14-release-receipts.js --check
          node tests/all-approved-portals-launch-v1785.test.js
          cp ALL_APPROVED_PORTAL_LAUNCH_POLICY_V1.7.85.json "$GITHUB_WORKSPACE/"
          cp lib/allApprovedPortalLaunch.js "$GITHUB_WORKSPACE/lib/"
          cp tests/all-approved-portals-launch-v1785.test.js "$GITHUB_WORKSPACE/tests/"
          cp package.json server.js RELEASE_PAYLOAD_INVENTORY_SHA256.txt FILE_INVENTORY_SHA256.txt OWNER_RECEIPT.txt "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/one-time-v1785-all-portals-policy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ALL_APPROVED_PORTAL_LAUNCH_POLICY_V1.7.85.json lib/allApprovedPortalLaunch.js tests/all-approved-portals-launch-v1785.test.js package.json server.js RELEASE_PAYLOAD_INVENTORY_SHA256.txt FILE_INVENTORY_SHA256.txt OWNER_RECEIPT.txt .github/workflows/one-time-v1785-all-portals-policy.yml
          git commit -m "Adopt all-approved-portals coordinated launch policy"
          git push origin HEAD:release/v1.7.85-all-portals

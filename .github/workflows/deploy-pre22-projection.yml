name: Smarter Justice unified public UI deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pre22-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_BASE_URL: https://smarterjustice.com
  TARGET_SHA: e0a1242cf6c661ab97bfd953cb2f0dcde6146261
  ROLLBACK_SHA: 989dbe8f79bb88688daaa610827f0b4b8439c59c

concurrency:
  group: smarter-justice-unified-public-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Verify exact target
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          git show "$TARGET_SHA:scripts/apply-universal-public-home-v2.js" >/dev/null
          test "$(git show "$TARGET_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "1.7.98"
      - name: Require protected Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"
      - name: Request exact unified UI deployment
        id: deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${TARGET_SHA}" > "$RUNNER_TEMP/render-deploy-response.json"
          cat "$RUNNER_TEMP/render-deploy-response.json"
      - name: Verify materially new public UI
        id: smoke
        run: |
          set -euo pipefail
          delay=10
          for attempt in $(seq 1 16); do
            echo "Public UI verification attempt $attempt"
            if curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/health" > "$RUNNER_TEMP/health.json" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/" > "$RUNNER_TEMP/home.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/universal-smarter-justice" > "$RUNNER_TEMP/network.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/domestic-violence" > "$RUNNER_TEMP/dv.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/tax" > "$RUNNER_TEMP/tax.html"; then
              if HOME="$RUNNER_TEMP/home.html" NET="$RUNNER_TEMP/network.html" DV="$RUNNER_TEMP/dv.html" TAX="$RUNNER_TEMP/tax.html" node - <<'NODE'
          const fs=require('fs');
          const home=fs.readFileSync(process.env.HOME,'utf8');
          const net=fs.readFileSync(process.env.NET,'utf8');
          const dv=fs.readFileSync(process.env.DV,'utf8');
          const tax=fs.readFileSync(process.env.TAX,'utf8');
          if(!home.includes('UNIVERSAL_PUBLIC_HOME_V2'))process.exit(1);
          if(!home.includes('Start with what happened. We’ll help you find the right next step.'))process.exit(1);
          for(const x of ['storyRouteForm','Domestic Violence Aid','Justice Tax Solutions','Community Resource Aid'])if(!home.includes(x))process.exit(1);
          for(const forbidden of ['Universal Smarter Justice v2.0.0-pre22 · live inspection','source intake'])if(home.toLowerCase().includes(forbidden.toLowerCase()))process.exit(1);
          if(!net.includes('Focused specialty help, connected through one Smarter Justice platform.'))process.exit(1);
          if(!dv.includes('Domestic Violence Aid')||!dv.includes('Stop Sign Project'))process.exit(1);
          if(!tax.includes('Tax help without the runaround.')||!tax.includes('Justice Tax Solutions'))process.exit(1);
          console.log('materially new public UI verified');
          NODE
              then exit 0; fi
            fi
            sleep "$delay"; [ "$delay" -ge 30 ] || delay=$((delay+5))
          done
          exit 1
      - name: Request rollback after failed acceptance
        if: failure() && steps.deploy.outcome == 'success'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${ROLLBACK_SHA}" > "$RUNNER_TEMP/render-rollback-response.json"
      - name: Upload public UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-unified-public-ui-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/render-deploy-response.json
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/home.html
            ${{ runner.temp }}/network.html
            ${{ runner.temp }}/dv.html
            ${{ runner.temp }}/tax.html
            ${{ runner.temp }}/render-rollback-response.json
          if-no-files-found: warn
          retention-days: 14

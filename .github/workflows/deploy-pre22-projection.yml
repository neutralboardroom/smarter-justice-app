name: Smarter Justice qualified automatic Render deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

env:
  RENDER_BASE_URL: https://smarter-justice-app.onrender.com
  PUBLIC_BASE_URL: https://smarterjustice.com
  TARGET_SHA: ${{ github.sha }}
  ROLLBACK_SHA: 14b54e31d4cdec186424c9eb7e34a5f41689cf4f
  PRE42_ARTIFACT_SHA: 9956c52237ebc09bb6e4474c7c0a9863af6d952cabc3e030ee42942cc75cc4f5

concurrency:
  group: smarter-justice-qualified-render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Bind pre44 target and explicit prior known-good rollback
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          test -f deployment/pre42/PRE42_RENDER_PROJECTION.json
          test -f deployment/pre44/navigator_cli.py
          test -f deployment/pre44/test_pre44_navigator.py
          test -f scripts/apply-pre44-sitewide-ai.js
      - name: Wait for exact-commit qualification gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            success="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs" --jq '[.check_runs[] | select(.name == "qualification-gate" and .conclusion == "success")] | length')"
            failed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs" --jq '[.check_runs[] | select(.name == "qualification-gate" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length')"
            test "$failed" = "0" || exit 1
            if [ "$success" -ge 1 ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Require protected Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"
      - name: Request exact qualified Render deployment
        id: deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${TARGET_SHA}" > "$RUNNER_TEMP/render-deploy-response.json"
      - name: Require live pre44 sitewide Navigator and AI
        id: smoke
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/navigator-cookies.txt"
          for attempt in $(seq 1 42); do
            rm -f "$jar"
            if curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/health" > "$RUNNER_TEMP/health.json" \
              && curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/.well-known/smarter-justice-pre42-deployment.json" > "$RUNNER_TEMP/pre42.json" \
              && curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/navigator" > "$RUNNER_TEMP/navigator.html" \
              && curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/app.js" > "$RUNNER_TEMP/app.js" \
              && curl --fail --silent --show-error --max-time 20 -c "$jar" "$RENDER_BASE_URL/api/navigator/status" > "$RUNNER_TEMP/navigator-status.json" \
              && curl --fail --silent --show-error --max-time 50 -b "$jar" -c "$jar" -H 'Content-Type: application/json' -d '{"message":"Reply with exactly: SMARTER JUSTICE PRE44 AI READY","toolMode":"NAVIGATOR","inputMode":"TEXT","pageContext":"Smarter Justice live acceptance"}' "$RENDER_BASE_URL/api/navigator/chat" > "$RUNNER_TEMP/navigator-chat.json" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/navigator" > "$RUNNER_TEMP/public-navigator.html"; then
              if STATUS="$RUNNER_TEMP/navigator-status.json" CHAT="$RUNNER_TEMP/navigator-chat.json" NAV="$RUNNER_TEMP/navigator.html" APP="$RUNNER_TEMP/app.js" PUBLIC_NAV="$RUNNER_TEMP/public-navigator.html" node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync(process.env.STATUS,'utf8'));
          const c=JSON.parse(fs.readFileSync(process.env.CHAT,'utf8'));
          const nav=fs.readFileSync(process.env.NAV,'utf8');
          const app=fs.readFileSync(process.env.APP,'utf8');
          const pub=fs.readFileSync(process.env.PUBLIC_NAV,'utf8');
          if(s.ok!==true||s.version!=='v2.0.0-pre44'||s.publicAiEnabled!==true||s.providerReadiness?.ready!==true)process.exit(1);
          if(!['DURABLE_SQLITE','RUNTIME_LOCAL_SQLITE'].includes(s.persistenceMode))process.exit(1);
          if(typeof s.durablePersistenceAccepted!=='boolean')process.exit(1);
          if(c.ok!==true||!String(c.answer||'').includes('SMARTER JUSTICE PRE44 AI READY'))process.exit(1);
          if(c.usageLedgerRecorded!==true||c.storeRequested!==false||c.externalActionsExecuted!==false)process.exit(1);
          if(!/v2\.0\.0-pre44/.test(nav)||!/v2\.0\.0-pre44/.test(pub))process.exit(1);
          if(!app.includes('SMARTER_JUSTICE_PRE44_SITEWIDE_NAVIGATOR'))process.exit(1);
          NODE
              then exit 0; fi
            fi
            sleep 10
          done
          exit 1
      - name: Request automatic rollback after failed live acceptance
        if: failure() && steps.deploy.outcome == 'success'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${ROLLBACK_SHA}" > "$RUNNER_TEMP/render-rollback-response.json"
      - name: Upload immutable deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smarter-justice-pre44-render-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/render-deploy-response.json
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/pre42.json
            ${{ runner.temp }}/navigator.html
            ${{ runner.temp }}/app.js
            ${{ runner.temp }}/navigator-status.json
            ${{ runner.temp }}/navigator-chat.json
            ${{ runner.temp }}/public-navigator.html
            ${{ runner.temp }}/render-rollback-response.json
          if-no-files-found: warn
          retention-days: 90

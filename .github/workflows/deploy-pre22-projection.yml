name: Smarter Justice qualified automatic Render deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

env:
  RENDER_BASE_URL: https://smarter-justice-app.onrender.com
  PUBLIC_BASE_URL: https://smarterjustice.com
  TARGET_SHA: ${{ github.sha }}
  PRE42_ARTIFACT_SHA: 9956c52237ebc09bb6e4474c7c0a9863af6d952cabc3e030ee42942cc75cc4f5

concurrency:
  group: smarter-justice-qualified-render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Bind target, rollback, pre42 foundation, and pre43 public AI
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          rollback="$(git rev-parse HEAD^)"
          git cat-file -e "$rollback^{commit}"
          echo "ROLLBACK_SHA=$rollback" >> "$GITHUB_ENV"
          test "$(node -p "require('./package.json').version")" = "1.7.98"
          test -f deployment/pre42/PRE42_RENDER_PROJECTION.json
          test -f deployment/pre43/navigator_preview_cli.py
          test -f deployment/pre43/test_pre43_navigator.py
          test -f scripts/apply-pre43-navigator-preview.js
          test -f scripts/apply-pre46-growth-operations-compliance-story.js
          test -f deployment/pre46/test_pre46_growth_operations_compliance_story.py
          test -f scripts/apply-pre47-professional-growth.js
          test -f deployment/pre47/test_pre47_professional_growth.py
          test -f scripts/apply-pre48-marketing-compliance-expansion.js
          test -f deployment/pre48/test_pre48_marketing_compliance_expansion.py
          PRE42_ARTIFACT_SHA="$PRE42_ARTIFACT_SHA" node - <<'NODE'
          const fs=require('fs');
          const row=JSON.parse(fs.readFileSync('deployment/pre42/PRE42_RENDER_PROJECTION.json','utf8'));
          if(row.projection!=='PRE42_RENDER_CONTROLLED_ACCEPTANCE_V1')process.exit(1);
          if(row.authoritativeProduct?.sha256!==process.env.PRE42_ARTIFACT_SHA)process.exit(1);
          if(row.deploymentBoundary?.outboundActionsEnabledByProjection!==false)process.exit(1);
          NODE

      - name: Wait for exact-commit qualification gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            success="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs" --jq '[.check_runs[] | select(.name == "qualification-gate" and .conclusion == "success")] | length')"
            failed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs" --jq '[.check_runs[] | select(.name == "qualification-gate" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length')"
            test "$failed" = "0" || exit 1
            if [ "$success" -ge 1 ]; then exit 0; fi
            echo "qualification gate pending: attempt $attempt"
            sleep 10
          done
          echo 'qualification gate did not reach success' >&2
          exit 1

      - name: Require protected Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"

      - name: Request exact qualified Render deployment
        id: deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${TARGET_SHA}" > "$RUNNER_TEMP/render-deploy-response.json"
          python3 - <<'PY'
          import pathlib, os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'render-deploy-response.json'
          print(p.read_text(errors='replace')[:800])
          PY

      - name: Require live core Navigator and pre46/pre47 professional story plus pre48 five-jurisdiction marketing-preflight routes
        id: smoke
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/navigator-cookies.txt"
          for attempt in $(seq 1 42); do
            echo "public live acceptance attempt $attempt"
            rm -f "$jar"
            if curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/health" > "$RUNNER_TEMP/health.json" \
              && curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/.well-known/smarter-justice-pre42-deployment.json" > "$RUNNER_TEMP/pre42.json" \
              && curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/navigator" > "$RUNNER_TEMP/navigator.html" \
              && curl --fail --silent --show-error --max-time 20 -c "$jar" "$RENDER_BASE_URL/api/navigator/status" > "$RUNNER_TEMP/navigator-status.json" \
              && curl --fail --silent --show-error --max-time 50 -b "$jar" -c "$jar" -H 'Content-Type: application/json' -d '{"message":"Reply with exactly: SMARTER JUSTICE PUBLIC AI READY","toolMode":"NAVIGATOR","inputMode":"TEXT"}' "$RENDER_BASE_URL/api/navigator/chat" > "$RUNNER_TEMP/navigator-chat.json" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/navigator" > "$RUNNER_TEMP/public-navigator.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/" > "$RUNNER_TEMP/public-home.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/growth-operations-compliance.html" > "$RUNNER_TEMP/public-growth-operations-compliance.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/attorney-call-tour.html" > "$RUNNER_TEMP/public-attorney-call-tour.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUP“PЧРђTСWХT“Ь›Щ™\ЬЪ[Ы[YЬ›ЭЭљ[€€‰•S“‘T—ХSTЬX›XЛ\›Щ™\ЬЪ[Ы[YЬ›ЭЭљ[€€	‰€Э\›KYZ[K\Ъ[[ќK\ЪЭЛY\њ›Ь€K[X^][YHЊ‰P“PЧРђTСWХT“Ь›Щ™\ЬЪ[Ы[[Y[X™\њЪ\љ[€€‰•S“‘T—ХSTЬX›XЛ\›Щ™\ЬЪ[Ы[[Y[X™\њЪ\љ[€€	‰€Э\›KYZ[K\Ъ[[ќK\ЪЭЛY\њ›Ь€K[X^][YHЊ‰P“PЧРђTСWХT“Ш]Ь›™^K\\ќ™\‹]Э\‹љ[€€‰•S“‘T—ХSTЬX›XЛX]Ь›™^K]Э\‹љ[€€	‰€Э\›KYZ[K\Ъ[[ќK\ЪЭЛY\њ›Ь€K[X^][YHЊ‰P“PЧРђTСWХT“ЫX\љЩ][™ЛXЫЫ\X[ЩK\™MY]KљњИ€€‰•S“‘T—ХSTЬX›XЛ[X\љЩ][™Л\ќ[\Л\™MљњИЋИ[‚€Y€PSH‰•S“‘T—ХSTЪX[љњЫЫ€€‘MЏH‰•S“‘T—ХSTЬ™M‹љњЫЫ€€ХUTПH‰•S“‘T—ХSTЫ]љYШ]Ь‹\Э]\ЛљњЫЫ€€ТUH‰•S“‘T—ХSTЫ]љYШ]Ь‹XЪ]љњЫЫ€€ђUЏH‰•S“‘T—ХSTЫ]љYШ]Ь‹љ[€P“PЧУђUЏH‰•S“‘T—ХSTЬX›XЛ[]љYШ]Ь‹љ[€P“PЧТУQOH‰•S“‘T—ХSTЬX›XЛZЫYKљ[€УРПH‰•S“‘T—ХSTЬX›XЛYЬ›ЭЭ[Ь\][ЫњЛXЫЫ\X[ЩKљ[€URPТПH‰•S“‘T—ХSTЬX›XЛX]Ь›™^KXШ[]Э\‹љ[€Ф“ХХH‰•S“‘T—ХSTЬX›XЛ\›Щ™\ЬЪ[Ы[YЬ›ЭЭљ[€QSP‘T”ТTH‰•S“‘T—ХSTЬX›XЛ\›Щ™\ЬЪ[Ы[[Y[X™\њЪ\љ[€ХTЏH‰•S“‘T—ХSTЬX›XЛX]Ь›™^K]Э\‹љ[€•STПH‰•S“‘T—ХSTЬX›XЛ[X\љЩ][™Л\ќ[\Л\™MљњИ€‘M—РT•QђPХФТOH‰‘M—РT•QђPХФТH€›ЩHH	У“СIВ€ЫЫњЭњП\™\]Z\™J	ЩњЙКNВ€ЫЫњЭX[R”УУ‹њ\њЩJњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹’PS	Э]Ћ	КJNВ€ЫЫњЭR”УУ‹њ\њЩJњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹”‘M‹	Э]Ћ	КJNВ€ЫЫњЭЭ]\ПR”УУ‹њ\њЩJњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹”ХUTЛ	Э]Ћ	КJNВ€ЫЫњЭЪ]R”УУ‹њ\њЩJњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹ђТU	Э]Ћ	КJNВ€ЫЫњЭ]ЏYњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹“ђU‹	Э]Ћ	КNВ€ЫЫњЭX›XУ]ЏYњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹”P“PЧУђU‹	Э]Ћ	КNВ€ЫЫњЭX›XТЫYOYњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹”P“PЧТУQK	Э]Ћ	КNВ€ЫЫњЭЫШПYњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹‘УРЛ	Э]Ћ	КNВ€ЫЫњЭ]ZXЪПYњЛњ™XYљ[TЮ[К›ШЩ\ЬЛ™[ќ‹”UR
name: Recover exact v1.7.83 source for upgrade

on:
  push:
    branches:
      - agent/deploy-smarter-justice-v1.7.92

permissions:
  contents: read

jobs:
  recover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository-issued v1.7.83 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 180 \
            'https://github.com/neutralboardroom/smarter-justice-app/releases/download/v1.7.83/smarter-justice-v1.7.83-FULL-SOURCE.zip' \
            --output /tmp/smarter-justice-v1.7.83-FULL-SOURCE.zip
          echo '3a0183108a11c216dc7eb3c83694875c6914c2349e2a05fdc05833022b40c3b6  /tmp/smarter-justice-v1.7.83-FULL-SOURCE.zip' | sha256sum --check --strict
      - name: Upload exact source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-v1.7.83-full-source-recovery
          path: /tmp/smarter-justice-v1.7.83-FULL-SOURCE.zip
          if-no-files-found: error
          retention-days: 1

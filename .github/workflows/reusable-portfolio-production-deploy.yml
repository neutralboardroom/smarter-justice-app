name: Reusable portfolio production deploy

on:
  workflow_call:
    inputs:
      config_path:
        required: false
        default: deployment/product-deployment.json
        type: string
      target_sha:
        description: Exact qualified 40-character commit SHA.
        required: true
        type: string
      target_version:
        description: Exact authorized product version.
        required: true
        type: string
      authorization_id:
        description: Product-scoped owner authorization or approved automatic-release receipt ID.
        required: true
        type: string
      migration_class:
        description: Accepted migration class.
        required: true
        type: string
      backup_receipt_id:
        description: Current backup or restore-readiness receipt ID.
        required: true
        type: string
    secrets:
      RENDER_DEPLOY_HOOK_URL:
        required: true
    outputs:
      deployed_sha:
        value: ${{ jobs.deploy.outputs.deployed_sha }}
      deployed_version:
        value: ${{ jobs.deploy.outputs.deployed_version }}

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: portfolio-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    outputs:
      deployed_sha: ${{ steps.target.outputs.sha }}
      deployed_version: ${{ steps.target.outputs.version }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authorization inputs
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION: ${{ inputs.target_version }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          MIGRATION_CLASS: ${{ inputs.migration_class }}
          BACKUP_RECEIPT_ID: ${{ inputs.backup_receipt_id }}
        run: |
          set -euo pipefail
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+([-.][A-Za-z0-9.]+)?$'
          printf '%s' "$AUTHORIZATION_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
          printf '%s' "$BACKUP_RECEIPT_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
          case "$MIGRATION_CLASS" in
            NO_MIGRATION|BACKWARD_COMPATIBLE_EXPAND|STATEFUL_REVERSIBLE) ;;
            *) echo 'Rejected migration class'; exit 1 ;;
          esac

      - name: Resolve exact authorized target
        id: target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION: ${{ inputs.target_version }}
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f "$CONFIG_PATH"
          test "$(node -p "require('./package.json').version")" = "$TARGET_VERSION"
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync(process.env.CONFIG_PATH,'utf8'));
          if(c.repository!==process.env.GITHUB_REPOSITORY) throw new Error('Repository mismatch');
          if(JSON.stringify(c.localization.requiredLocales)!==JSON.stringify(['en','es'])) throw new Error('English/Spanish parity missing');
          for(const k of ['persistentStorageRequired','backupReceiptRequired','migrationClassRequired','rollbackMustPreserveNewData']) if(c.dataContinuity[k]!==true) throw new Error(`Owner data rule missing: ${k}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`base_url_var=${c.health.publicBaseUrlVariable}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`paths_json=${JSON.stringify(c.health.paths)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`expected_name=${c.health.expectedProductName}\n`);
          NODE
          test -z "$(git status --porcelain)"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require successful exact-commit qualification gate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs" --jq '[.check_runs[] | select(.name == "qualification-gate" and .conclusion == "success")] | length')"
          test "$count" -ge 1

      - name: Require protected public base URL
        id: live
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_BASE_URL"
          printf '%s' "$PUBLIC_BASE_URL" | grep -Eq '^https://[^/]+$'
          echo "base_url=$PUBLIC_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Confirm Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"

      - name: Request exact-commit Render deployment
        id: deploy_request
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${TARGET_SHA}" > "$RUNNER_TEMP/render-deploy-response.json"

      - name: Verify exact live version and required health paths
        env:
          PUBLIC_BASE_URL: ${{ steps.live.outputs.base_url }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          PATHS_JSON: ${{ steps.target.outputs.paths_json }}
          EXPECTED_NAME: ${{ steps.target.outputs.expected_name }}
        run: |
          set -euo pipefail
          delay=10
          for attempt in $(seq 1 18); do
            echo "Verification attempt $attempt"
            if node - <<'NODE'
          const {execFileSync}=require('child_process');
          const base=process.env.PUBLIC_BASE_URL;
          const version=process.env.TARGET_VERSION;
          const expected=process.env.EXPECTED_NAME;
          const paths=JSON.parse(process.env.PATHS_JSON);
          for(const p of paths){
            const raw=execFileSync('curl',['--fail','--silent','--show-error','--max-time','20',base+p],{encoding:'utf8'});
            if(p.includes('health')||p.includes('livez')){
              const data=JSON.parse(raw);
              if(data.ok!==true) throw new Error(`${p} not ok`);
              if(data.version!==version) throw new Error(`${p} version mismatch`);
              if(data.app && data.app!==expected) throw new Error(`${p} product mismatch`);
            }
          }
          NODE
            then
              echo "Exact live verification succeeded."
              exit 0
            fi
            sleep "$delay"
            if [ "$delay" -lt 60 ]; then delay=$((delay*2)); [ "$delay" -gt 60 ] && delay=60; fi
          done
          exit 1

      - name: Record successful deployment evidence
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          BACKUP_RECEIPT_ID: ${{ inputs.backup_receipt_id }}
          MIGRATION_CLASS: ${{ inputs.migration_class }}
          PUBLIC_BASE_URL: ${{ steps.live.outputs.base_url }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const out={
            schemaVersion:1,
            repository:process.env.GITHUB_REPOSITORY,
            deployedSha:process.env.TARGET_SHA,
            deployedVersion:process.env.TARGET_VERSION,
            authorizationId:process.env.AUTHORIZATION_ID,
            backupReceiptId:process.env.BACKUP_RECEIPT_ID,
            migrationClass:process.env.MIGRATION_CLASS,
            publicBaseUrl:process.env.PUBLIC_BASE_URL,
            deployedAt:new Date().toISOString(),
            ownerRules:{persistentUserData:true,englishSpanishParity:true}
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/production-deployment-receipt.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-production-evidence-${{ github.repository_id }}-${{ inputs.target_sha }}
          path: |
            ${{ runner.temp }}/render-deploy-response.json
            ${{ runner.temp }}/production-deployment-receipt.json
          if-no-files-found: warn
          retention-days: 30

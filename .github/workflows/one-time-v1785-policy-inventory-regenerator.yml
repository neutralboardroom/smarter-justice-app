name: One-time v1.7.85 policy inventory regenerator

on:
  push:
    branches:
      - release/v1.7.85-all-portals
    paths:
      - .github/workflows/one-time-v1785-policy-inventory-regenerator.yml

permissions:
  contents: write

jobs:
  regenerate-and-remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/v1.7.85-all-portals
          fetch-depth: 0
          persist-credentials: true
      - name: Validate policy and regenerate inventories
        shell: bash
        run: |
          set -euo pipefail
          node tests/all-approved-portals-launch-v1785.test.js
          TEMP_ROOT="$(mktemp -d)"
          git archive HEAD | tar -x -C "$TEMP_ROOT"
          rm -f "$TEMP_ROOT/.github/workflows/one-time-v1785-policy-inventory-regenerator.yml"
          cd "$TEMP_ROOT"
          node <<'NODE'
          'use strict';
          const fs=require('fs');const path=require('path');const crypto=require('crypto');const root=process.cwd();
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const walk=()=>{const out=[];(function visit(dir){for(const name of fs.readdirSync(dir).sort((a,b)=>a.localeCompare(b))){const full=path.join(dir,name),rel=path.relative(root,full).split(path.sep).join('/'),st=fs.lstatSync(full);if(st.isSymbolicLink())throw new Error(`symlink:${rel}`);if(st.isDirectory())visit(full);else if(st.isFile())out.push(rel);}})(root);return out;};
          const inventory=exclusions=>{const excluded=new Set(exclusions);return walk().filter(p=>!excluded.has(p)).sort((a,b)=>a.localeCompare(b)).map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`).join('\n')+'\n';};
          const payload=inventory(['OWNER_RECEIPT.txt','RELEASE_PAYLOAD_INVENTORY_SHA256.txt','FILE_INVENTORY_SHA256.txt']);
          fs.writeFileSync('RELEASE_PAYLOAD_INVENTORY_SHA256.txt',payload);
          let owner=fs.readFileSync('OWNER_RECEIPT.txt','utf8');
          owner=owner.replace(/^RELEASE_PAYLOAD_INVENTORY_SHA256:.*$/m,`RELEASE_PAYLOAD_INVENTORY_SHA256: ${sha(Buffer.from(payload))}`);
          owner=owner.replace(/^RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT:.*$/m,`RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT: ${payload.trimEnd().split('\n').filter(Boolean).length}`);
          fs.writeFileSync('OWNER_RECEIPT.txt',owner);
          fs.writeFileSync('FILE_INVENTORY_SHA256.txt',inventory(['FILE_INVENTORY_SHA256.txt']));
          NODE
          node scripts/generate-v14-release-receipts.js --check
          node tests/all-approved-portals-launch-v1785.test.js
          cp RELEASE_PAYLOAD_INVENTORY_SHA256.txt FILE_INVENTORY_SHA256.txt OWNER_RECEIPT.txt "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/one-time-v1785-policy-inventory-regenerator.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RELEASE_PAYLOAD_INVENTORY_SHA256.txt FILE_INVENTORY_SHA256.txt OWNER_RECEIPT.txt .github/workflows/one-time-v1785-policy-inventory-regenerator.yml
          git commit -m "Regenerate inventories for all-approved-portals policy"
          git push origin HEAD:release/v1.7.85-all-portals

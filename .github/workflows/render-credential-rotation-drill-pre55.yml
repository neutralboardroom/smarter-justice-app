name: Smarter Justice pre55 protected Render credential rotation drill

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Rotation phase to verify
        required: true
        type: choice
        options:
          - candidate-access
          - retired-denied
          - active-access
      started_at_utc:
        description: ISO UTC timestamp when the protected rotation window began
        required: true
        type: string
      change_reference:
        description: Nonsecret change or incident reference
        required: true
        type: string
      confirmation:
        description: Type ROTATE_RENDER_CREDENTIAL_PRE55
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smarter-justice-render-credential-rotation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the exact protected drill implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Bind release, confirmation and time window
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "ROTATE_RENDER_CREDENTIAL_PRE55"
          test "$(node -p "require('./deployment/pre55/PROVIDER_CREDENTIAL_ROTATION_DRILL__PRE55.json').release")" = "v2.0.0-pre55"
          node --check scripts/render-credential-rotation-drill-pre55.js

      - name: Verify candidate credential access
        if: inputs.phase == 'candidate-access'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_CANDIDATE }}
          RENDER_SERVICE_ID: srv-d8ps9jgjs32c73918vvg
          RENDER_ROTATION_STARTED_AT: ${{ inputs.started_at_utc }}
          RENDER_ROTATION_CHANGE_REF: ${{ inputs.change_reference }}
          RENDER_ROTATION_MAX_MINUTES: '60'
          RENDER_ROTATION_EVIDENCE_PATH: ${{ runner.temp }}/render-credential-rotation.jsonl
        run: node scripts/render-credential-rotation-drill-pre55.js candidate-access

      - name: Verify retired credential denial
        if: inputs.phase == 'retired-denied'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_RETIRED }}
          RENDER_SERVICE_ID: srv-d8ps9jgjs32c73918vvg
          RENDER_ROTATION_STARTED_AT: ${{ inputs.started_at_utc }}
          RENDER_ROTATION_CHANGE_REF: ${{ inputs.change_reference }}
          RENDER_ROTATION_MAX_MINUTES: '60'
          RENDER_ROTATION_EVIDENCE_PATH: ${{ runner.temp }}/render-credential-rotation.jsonl
        run: node scripts/render-credential-rotation-drill-pre55.js retired-denied

      - name: Verify final active credential access
        if: inputs.phase == 'active-access'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d8ps9jgjs32c73918vvg
          RENDER_ROTATION_STARTED_AT: ${{ inputs.started_at_utc }}
          RENDER_ROTATION_CHANGE_REF: ${{ inputs.change_reference }}
          RENDER_ROTATION_MAX_MINUTES: '60'
          RENDER_ROTATION_EVIDENCE_PATH: ${{ runner.temp }}/render-credential-rotation.jsonl
        run: node scripts/render-credential-rotation-drill-pre55.js active-access

      - name: Upload redacted rotation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-pre55-render-credential-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/render-credential-rotation.jsonl
          if-no-files-found: warn
          retention-days: 90

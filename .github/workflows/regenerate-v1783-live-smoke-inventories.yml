name: Regenerate v1.7.83 live-smoke inventories

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/regenerate-v1783-live-smoke-inventories.yml'

permissions:
  contents: write

concurrency:
  group: smarter-justice-v1783-live-smoke-inventory
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated correction branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/v1.7.83-live-smoke-contract-fix
          fetch-depth: 0
      - name: Validate exact correction scope
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only origin/main...HEAD | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/deploy-production.yml
          .github/workflows/regenerate-v1783-live-smoke-inventories.yml
          lib/serviceReadiness.js
          tests/service-readiness-v1749.test.js
          EOF
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          grep -F "const TARGET_RELEASE_VERSION = '1.7.83';" lib/serviceReadiness.js
          grep -F "livez.version!==process.env.TARGET_VERSION" .github/workflows/deploy-production.yml
          grep -F "Start with the problem" .github/workflows/deploy-production.yml
          grep -F "Tell us what happened" .github/workflows/deploy-production.yml
          ! grep -F "One clearer starting point" .github/workflows/deploy-production.yml
      - name: Regenerate non-self-referential inventories
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const root=process.cwd();
          const temporary='.github/workflows/regenerate-v1783-live-smoke-inventories.yml';
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          function walk(){
            const out=[];
            function visit(dir){
              for(const name of fs.readdirSync(dir).sort((a,b)=>a.localeCompare(b))){
                if(dir===root && name==='.git') continue;
                const full=path.join(dir,name);
                const rel=path.relative(root,full).split(path.sep).join('/');
                const st=fs.lstatSync(full);
                if(st.isSymbolicLink()) throw new Error(`symlink:${rel}`);
                if(st.isDirectory()) visit(full);
                else if(st.isFile()) out.push(rel);
              }
            }
            visit(root);
            return out;
          }
          const payloadExcluded=new Set(['OWNER_RECEIPT.txt','RELEASE_PAYLOAD_INVENTORY_SHA256.txt','FILE_INVENTORY_SHA256.txt',temporary]);
          const payload=walk().filter(p=>!payloadExcluded.has(p)).sort((a,b)=>a.localeCompare(b)).map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`).join('\n')+'\n';
          fs.writeFileSync('RELEASE_PAYLOAD_INVENTORY_SHA256.txt',payload);
          const payloadSha=sha(Buffer.from(payload));
          const payloadRecords=payload.trimEnd().split('\n').filter(Boolean).length;
          if(payloadRecords!==3145) throw new Error(`Unexpected payload record count: ${payloadRecords}`);
          let owner=fs.readFileSync('OWNER_RECEIPT.txt','utf8');
          owner=owner
            .replace(/^RELEASE_PAYLOAD_INVENTORY_SHA256:.*$/m,`RELEASE_PAYLOAD_INVENTORY_SHA256: ${payloadSha}`)
            .replace(/^RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT:.*$/m,`RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT: ${payloadRecords}`);
          fs.writeFileSync('OWNER_RECEIPT.txt',owner);
          const fileInventory=walk().filter(p=>p!=='FILE_INVENTORY_SHA256.txt'&&p!==temporary).sort((a,b)=>a.localeCompare(b)).map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`).join('\n')+'\n';
          fs.writeFileSync('FILE_INVENTORY_SHA256.txt',fileInventory);
          const fileSha=sha(Buffer.from(fileInventory));
          const fileRecords=fileInventory.trimEnd().split('\n').filter(Boolean).length;
          if(fileRecords!==3147) throw new Error(`Unexpected file record count: ${fileRecords}`);
          console.log(JSON.stringify({payloadSha,payloadRecords,fileSha,fileRecords},null,2));
          NODE
      - name: Commit only receipt and inventories
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OWNER_RECEIPT.txt RELEASE_PAYLOAD_INVENTORY_SHA256.txt FILE_INVENTORY_SHA256.txt
          test -z "$(git diff --cached --name-only | grep -Ev '^(OWNER_RECEIPT.txt|RELEASE_PAYLOAD_INVENTORY_SHA256.txt|FILE_INVENTORY_SHA256.txt)$' || true)"
          git commit -m 'Regenerate exact v1.7.83 live-smoke inventories'
          git push origin HEAD:agent/v1.7.83-live-smoke-contract-fix

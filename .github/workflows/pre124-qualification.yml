name: PRE124 qualification and exact runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pre124-qualification.yml'
      - 'package.json'
      - 'scripts/bootstrap-pre124-deploy.js'
      - 'scripts/bootstrap-pre124-release.js'
      - 'scripts/start-pre124-deploy.js'
      - 'deployment/pre124/**'
      - 'deployment/pre49/**'
      - '.github/workflows/marketing-compliance-currentness-pre49.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Smarter Justice authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install and build qualified PRE124 runtime
        run: npm ci --omit=dev
      - name: Re-run PRE124 qualification
        run: node scripts/bootstrap-pre124-release.js
      - name: Verify release marker and Stripe deferral
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const marker=JSON.parse(fs.readFileSync('.runtime/pre124-live/.pre124-render-bootstrap.json','utf8'));
          if(marker.release!=='v2.0.0-pre124'||marker.baseRelease!=='v2.0.0-pre123'||marker.productAuthority!=='SMARTER_JUSTICE_ONLY'||marker.navigatorOrCommunityMutation!==false||marker.stripeMutation!==false||marker.paymentSetupDeferredByOwner!==true||marker.productionDeploymentAuthorized!==true) process.exit(1);
          const receipt=JSON.parse(fs.readFileSync('.runtime/pre124-live/PRE124_COMPLETION_RECEIPT.json','utf8'));
          if(!receipt.predecessorUnchangedFilesHashVerified||receipt.changes.publicPagesAudited<100) process.exit(1);
          console.log(JSON.stringify({release:marker.release,baseRelease:marker.baseRelease,publicPagesAudited:receipt.changes.publicPagesAudited,stripeMutation:marker.stripeMutation,paymentSetupDeferredByOwner:marker.paymentSetupDeferredByOwner},null,2));
          NODE
      - name: Build exact PRE124 handoff ZIP
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, json
          root=pathlib.Path('.runtime/pre124-live')
          out=pathlib.Path('SMARTER_JUSTICE__V2.0.0-PRE124__ATTORNEY_LAUNCH_COMPLETION__NO_STRIPE_MUTATION__2026-08-29.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(2026,8,29,12,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644 << 16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path(out.name+'.sha256.txt').write_text(f'{digest}  {out.name}\n')
          receipt=json.loads((root/'PRE124_COMPLETION_RECEIPT.json').read_text())
          receipt['exactHandoffZip']={'fileName':out.name,'sha256':digest,'sizeBytes':out.stat().st_size}
          pathlib.Path('PRE124_EXACT_HANDOFF_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(digest, out.stat().st_size)
          PY
      - name: Upload exact PRE124 handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-pre124-exact-handoff
          path: |
            SMARTER_JUSTICE__V2.0.0-PRE124__ATTORNEY_LAUNCH_COMPLETION__NO_STRIPE_MUTATION__2026-08-29.zip
            SMARTER_JUSTICE__V2.0.0-PRE124__ATTORNEY_LAUNCH_COMPLETION__NO_STRIPE_MUTATION__2026-08-29.zip.sha256.txt
            PRE124_EXACT_HANDOFF_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

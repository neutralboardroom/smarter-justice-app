name: PRE97 Exact Carrier Qualification
on:
  push:
    branches: [pre97-screenshot-audit-ux-auth-20260818]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-pre97:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build PRE97 from exact PRE96 carrier
        run: node scripts/pre97/build-pre97-candidate.js
      - name: Install candidate dependencies
        run: npm --prefix .runtime/pre97-candidate ci --no-audit --no-fund --ignore-scripts
      - name: Stage inherited tests for qualification only
        run: |
          rm -rf .runtime/pre97-candidate/tests
          cp -a tests .runtime/pre97-candidate/tests
      - name: Run inherited candidate tests
        run: npm --prefix .runtime/pre97-candidate test
      - name: Start PRE97 candidate and smoke critical routes
        shell: bash
        run: |
          set -euo pipefail
          PORT=3197 NODE_ENV=test APP_BASE_URL=http://127.0.0.1:3197 node .runtime/pre97-candidate/server.js > /tmp/pre97-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/pre97-server.log || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3197/health >/tmp/pre97-health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3197/health
          for route in / /professionals.html /professional-profile.html /firm-profile.html /attorney-partner-tour.html /professional-signup.html /professional-login.html /owner-login.html /owner-password-reset.html /control-center.html /profile-review.html; do
            echo "CHECK $route"
            curl -fsS -o /tmp/pre97-page.html -w '%{http_code}\n' "http://127.0.0.1:3197$route" | grep -E '^200$'
            test $(wc -c </tmp/pre97-page.html) -gt 300
          done
      - name: Verify built release receipt
        run: |
          cat .build/pre97/PRE97_ARTIFACT_RECEIPT.json
          test -s .build/pre97/PRE97_DEPLOY_RUNTIME.tgz
          test ! -e .build/pre97/tests
      - name: Upload PRE97 exact runtime
        uses: actions/upload-artifact@v4
        with:
          name: SMARTER_JUSTICE_PRE97_EXACT_RUNTIME
          path: |
            .build/pre97/PRE97_DEPLOY_RUNTIME.tgz
            .build/pre97/PRE97_ARTIFACT_RECEIPT.json
            .runtime/pre97-candidate/deployment/pre97/PRE97_RELEASE_SUMMARY.json
          if-no-files-found: error
          retention-days: 30

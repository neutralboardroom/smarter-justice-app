name: Inspect Smarter Justice AI production gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspect-ai-production-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: a092cbeb6df761c1ec71279b72969d614084db91

jobs:
  inspect-ai-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Extract exact sealed v1.7.98 runtime
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_SHA"
          rm -rf "$RUNNER_TEMP/sj-inspect"; mkdir -p "$RUNNER_TEMP/sj-inspect"
          python3 - <<'PY'
          import pathlib, zipfile, os
          src=pathlib.Path('smarter-justice-v1.7.98-comprehensive-community-value.zip')
          dst=pathlib.Path(os.environ['RUNNER_TEMP'])/'sj-inspect'
          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  p=pathlib.PurePosixPath(info.filename.replace('\\','/'))
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('unsafe zip member')
              z.extractall(dst)
          PY
      - name: Report exact AI gate state
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/sj-inspect/smarter-justice-v1.7.98"
          OUT="$RUNNER_TEMP/ai-production-gate-details.json"
          ROOT="$ROOT" OUT="$OUT" python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['ROOT'])
          reg=json.loads((root/'FEATURE_FLAG_AND_KILL_SWITCH_REGISTER_V1.7.98.json').read_text())
          gate=json.loads((root/'RELEASE_GATE_SUMMARY_V1.7.98.json').read_text())
          ai=(reg.get('capabilities') or {}).get('ai')
          if not ai: raise SystemExit('missing capabilities.ai')
          out={'aiCapability':ai,'releaseGateSummary':gate,'registerSchemaVersion':reg.get('schemaVersion'),'registerVersion':reg.get('version') or reg.get('releaseVersion')}
          pathlib.Path(os.environ['OUT']).write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Upload exact gate details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-ai-production-gate-details-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-production-gate-details.json
          if-no-files-found: error
          retention-days: 7

name: Smarter Justice exact production deploy

on:
  push:
    branches: [production-release]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: smarter-justice-production
  cancel-in-progress: false

env:
  PUBLIC_BASE_URL: https://smarterjustice.com
  EXPECTED_VERSION: '1.7.101'
  ROLLBACK_REF: fc0f6c706234b8f516bc1a1f062ae8edf0db8ff2
  ROLLBACK_VERSION: '1.7.98'

jobs:
  deploy-exact-qualified-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout exact production-release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require target commit to be contained in main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify owner authorization and exact target identity
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          node - <<'NODE'
          const fs=require('fs');
          const auth=JSON.parse(fs.readFileSync('deployment/AUTONOMOUS_DEPLOYMENT_AUTHORIZATION_V1.7.101.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('release-delta/v17101-runtime-manifest.json','utf8'));
          if(auth.status!=='AUTHORIZED'||auth.scope!=='SMARTER_JUSTICE_CENTRAL'||auth.targetVersion!==process.env.EXPECTED_VERSION)process.exit(1);
          if(auth.executeDontDelegate!==true||auth.humanOnlyEscalation!==true)process.exit(1);
          if(manifest.targetVersion!==process.env.EXPECTED_VERSION)process.exit(1);
          if(manifest.targetArtifactSha256!=='af4523a2d2b9635dd8824141d7e2e4aac9327f28d7ce56d7f2fa50429d2a158e')process.exit(1);
          NODE
      - name: Require successful qualification gate for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "qualification-gate" and .conclusion == "success")] | length')"
          test "$count" -ge 1
      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Reconstruct and inventory-verify exact v1.7.101 runtime
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Capture and validate previous live health before mutation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/health?predeploy=$GITHUB_RUN_ID" > "$RUNNER_TEMP/previous-health.json"
          PREVIOUS_HEALTH="$RUNNER_TEMP/previous-health.json" node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync(process.env.PREVIOUS_HEALTH,'utf8'));
          if(h.ok!==true||h.app!=='Smarter Justice')process.exit(1);
          if(!['1.7.98','1.7.101'].includes(String(h.version||'')))process.exit(1);
          NODE
      - name: Require protected Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: test -n "$RENDER_DEPLOY_HOOK_URL"
      - name: Request exact-commit Render deployment
        id: deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${GITHUB_SHA}" > "$RUNNER_TEMP/render-deploy-response.json"
          head -c 1200 "$RUNNER_TEMP/render-deploy-response.json" || true
      - name: Verify uncached live v1.7.101 and critical public UX
        id: smoke
        run: |
          set -euo pipefail
          delay=10
          for attempt in $(seq 1 18); do
            echo "Live verification attempt $attempt"
            q="sjverify=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/health?$q" > "$RUNNER_TEMP/health.json" \
              && curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/livez?$q" > "$RUNNER_TEMP/livez.json" \
              && curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/?$q" > "$RUNNER_TEMP/home.html" \
              && curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/jurisdictions.html?$q" > "$RUNNER_TEMP/jurisdictions.html" \
              && curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/es/jurisdicciones.html?$q" > "$RUNNER_TEMP/jurisdicciones-es.html" \
              && curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/pricing.html?$q" > "$RUNNER_TEMP/pricing.html" \
              && curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/professionals.html?$q" > "$RUNNER_TEMP/professionals.html" \
              && curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/portals.html?$q" > "$RUNNER_TEMP/portals.html" \
              && HEALTH="$RUNNER_TEMP/health.json" LIVEZ="$RUNNER_TEMP/livez.json" HOME="$RUNNER_TEMP/home.html" JUR="$RUNNER_TEMP/jurisdictions.html" JURES="$RUNNER_TEMP/jurisdicciones-es.html" PRICING="$RUNNER_TEMP/pricing.html" PROS="$RUNNER_TEMP/professionals.html" PORTALS="$RUNNER_TEMP/portals.html" node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync(process.env.HEALTH,'utf8'));
          const livez=JSON.parse(fs.readFileSync(process.env.LIVEZ,'utf8'));
          const home=fs.readFileSync(process.env.HOME,'utf8');
          const jur=fs.readFileSync(process.env.JUR,'utf8');
          const jures=fs.readFileSync(process.env.JURES,'utf8');
          const pricing=fs.readFileSync(process.env.PRICING,'utf8');
          const pros=fs.readFileSync(process.env.PROS,'utf8');
          const portals=fs.readFileSync(process.env.PORTALS,'utf8');
          if(health.ok!==true||health.version!==process.env.EXPECTED_VERSION||health.app!=='Smarter Justice')process.exit(1);
          if(health.sensitiveTrafficApproved!==false)process.exit(1);
          if(livez.ok!==true||livez.status!=='alive'||livez.version!==process.env.EXPECTED_VERSION)process.exit(1);
          if(!/Available in all 50 states and D\.C\. now/i.test(home))process.exit(1);
          if(!/All 50 states \+ D\.C\./i.test(jur))process.exit(1);
          if(!/District of Columbia/i.test(jures))process.exit(1);
          for(const [name,html] of Object.entries({home,jur,jures,pricing,pros,portals})){
            if(!/data-language-switch/i.test(html)){console.error('missing language switch',name);process.exit(1);}
          }
          for(const [name,html] of Object.entries({home,pricing,pros,portals})){
            if(/Historical launch architecture|development foundation|D3 adapter|activation gate|ten equal legal and tax practice areas/i.test(html)){
              console.error('forbidden internal/public jargon remains',name);process.exit(1);
            }
          }
          NODE
            then
              cp "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/production-smoke-evidence.json"
              exit 0
            fi
            sleep "$delay"
            if [ "$delay" -lt 60 ]; then delay=$((delay * 2)); [ "$delay" -gt 60 ] && delay=60; fi
          done
          exit 1
      - name: Restore verified v1.7.98 carrier after failed live smoke
        if: failure() && steps.deploy.outcome == 'success'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${ROLLBACK_REF}" > "$RUNNER_TEMP/render-rollback-response.json"
          delay=10
          for attempt in $(seq 1 18); do
            version="$(curl --fail --silent --show-error --max-time 25 "$PUBLIC_BASE_URL/health?rollback=${GITHUB_RUN_ID}-${attempt}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version||''))}catch{}})")" || true
            test "$version" = "$ROLLBACK_VERSION" && exit 0
            sleep "$delay"
            if [ "$delay" -lt 60 ]; then delay=$((delay * 2)); [ "$delay" -gt 60 ] && delay=60; fi
          done
          exit 1
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-production-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/previous-health.json
            ${{ runner.temp }}/render-deploy-response.json
            ${{ runner.temp }}/render-rollback-response.json
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/livez.json
            ${{ runner.temp }}/home.html
            ${{ runner.temp }}/jurisdictions.html
            ${{ runner.temp }}/jurisdicciones-es.html
            ${{ runner.temp }}/pricing.html
            ${{ runner.temp }}/professionals.html
            ${{ runner.temp }}/portals.html
            ${{ runner.temp }}/production-smoke-evidence.json
          if-no-files-found: warn
          retention-days: 14

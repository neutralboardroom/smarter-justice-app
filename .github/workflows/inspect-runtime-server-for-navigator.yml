name: Inspect runtime server for Navigator preview

on:
  push:
    branches: [inspect-v1798-server-for-navigator]
    paths: ['.github/workflows/inspect-runtime-server-for-navigator.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
      - name: Reconstruct qualified runtime
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run postinstall
      - name: Inspect runtime entry point and safe route seams
        run: |
          set -euo pipefail
          root='.runtime/smarter-justice-v1.7.98'
          echo '--- RUNTIME PACKAGE ---'
          cat "$root/package.json"
          echo '--- SERVER CANDIDATES ---'
          find "$root" -maxdepth 3 -type f \( -name 'server.js' -o -name 'index.js' -o -name 'app.js' \) -print
          entry="$(node -e "const p=require('./$root/package.json');process.stdout.write(String((p.scripts&&p.scripts.start)||''))")"
          echo "START_SCRIPT=$entry"
          echo '--- ROUTE/HTTP SEAMS ---'
          grep -RInE "createServer|app\\.(get|post|use)|req\\.url|pathname|/health|/livez|/api/ai-status|centralAiGateway|express\\(" "$root" --include='*.js' | head -n 350 || true
          echo '--- AUTH/TOKEN SEAMS ---'
          grep -RInE "authorization|bearer|token|AI_PORTAL_SERVICE_TOKENS_JSON|timingSafeEqual|crypto" "$root" --include='*.js' | head -n 250 || true

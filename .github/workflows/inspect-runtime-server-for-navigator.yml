name: Inspect runtime server for Navigator preview

on:
  push:
    branches: [inspect-v1798-server-for-navigator]
    paths: ['.github/workflows/inspect-runtime-server-for-navigator.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
      - name: Reconstruct qualified runtime
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run postinstall
      - name: Inspect owner session and login browser seams only
        run: |
          set -euo pipefail
          root='.runtime/smarter-justice-v1.7.98'
          echo '--- REQUIRE OWNER ---'
          sed -n '395,440p' "$root/server.js"
          echo '--- OWNER LOGIN API ---'
          sed -n '1345,1415p' "$root/server.js"
          echo '--- INTERNAL PAGE ROLE ---'
          sed -n '2208,2230p' "$root/server.js"
          echo '--- APP OWNER LOGIN HANDLER ---'
          grep -nE "ownerLoginForm|owner-login|ownerSession|OWNER" "$root/public/app.js" | head -n 120 || true
          for n in $(grep -n "ownerLoginForm" "$root/public/app.js" | cut -d: -f1 | head -n 3); do start=$((n-15)); [ $start -lt 1 ] && start=1; end=$((n+80)); sed -n "${start},${end}p" "$root/public/app.js"; done

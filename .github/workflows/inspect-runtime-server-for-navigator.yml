name: Inspect runtime server for Navigator preview

on:
  push:
    branches: [inspect-v1798-server-for-navigator]
    paths: ['.github/workflows/inspect-runtime-server-for-navigator.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
      - name: Reconstruct qualified runtime
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run postinstall
      - name: Inspect owner auth and AI route seams only
        run: |
          set -euo pipefail
          root='.runtime/smarter-justice-v1.7.98'
          echo '--- OWNER AUTH FUNCTIONS ---'
          grep -nE "function requireOwner|function internalPageRole|function redirectToInternalAccess|OWNER_CONTROL_CENTER_TOKEN|owner-login" "$root/server.js" | head -n 120 || true
          echo '--- SERVER AUTH REGION ---'
          sed -n '160,270p' "$root/server.js"
          echo '--- AI API REGION ---'
          sed -n '1080,1145p' "$root/server.js"
          echo '--- OWNER API REGION ---'
          sed -n '1600,1840p' "$root/server.js"
          echo '--- STATIC ROUTING REGION ---'
          sed -n '2218,2250p' "$root/server.js"
          echo '--- OWNER LOGIN FILES ---'
          find "$root/public" -maxdepth 1 -type f -iname '*owner*' -print | sort
          for f in "$root/public/owner-login.html" "$root/public/owner-login.js"; do
            if [ -f "$f" ]; then echo "--- $f ---"; sed -n '1,260p' "$f"; fi
          done

name: Inspect runtime server for Navigator preview

on:
  push:
    branches: [inspect-v1798-server-for-navigator]
    paths: ['.github/workflows/inspect-runtime-server-for-navigator.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
      - name: Reconstruct qualified runtime
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run postinstall
      - name: Inspect CSRF contract only
        run: |
          set -euo pipefail
          root='.runtime/smarter-justice-v1.7.98'
          grep -nE "csrf|CSRF|x-csrf|requestUsesAuthenticatedCookie|mutation" "$root/server.js" | head -n 220 || true
          echo '--- SECURITY MODULE CSRF ---'
          grep -RInE "csrf|CSRF|x-csrf" "$root/lib" --include='*.js' | head -n 180 || true
          echo '--- BROWSER CSRF HELPERS ---'
          grep -nE "csrf|CSRF|x-csrf" "$root/public/app.js" | head -n 180 || true

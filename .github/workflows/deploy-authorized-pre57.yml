name: Authorized Smarter Justice pre57 production deploy

on:
  push:
    branches:
      - deploy/authorized-smarter-justice-pre57

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: smarter-justice-current-production
  cancel-in-progress: false

env:
  RELEASE: v2.0.0-pre57
  RELEASE_MARKER: SMARTER_JUSTICE_PRE57_PROTECTED_PROFILE_CURRENTNESS_EXECUTION
  PRODUCT_ZIP_SHA256: 31fe0b5ccca6549f322cc970fd6d36e99168eebda1941837fdea790e9aaf0adf
  TARGET_SHA: eb823f46525b72d5c9faa49fe844f84d787f524d
  TARGET_TREE: 10e19b679707b73f8e162e4eed437bbe60c2a1a4
  RENDER_SERVICE_ID: srv-d8ps9jgjs32c73918vvg
  LAST_ACCEPTED_LIVE_SHA: a98c9adf8b34ed5acce188769d53be6f56d6587b
  LAST_ACCEPTED_LIVE_DEPLOY_ID: dep-d9tov2jncjis739p3s8g

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Checkout exact authorized production commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Bind exact qualified source and owner authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE" = 'v2.0.0-pre57'
          test "$PRODUCT_ZIP_SHA256" = '31fe0b5ccca6549f322cc970fd6d36e99168eebda1941837fdea790e9aaf0adf'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse "$TARGET_SHA^{tree}")" = '10e19b679707b73f8e162e4eed437bbe60c2a1a4'
          test -f deployment/pre57/PROFILE_CURRENTNESS_EXECUTION__PRE57.json
          node - <<'NODE'
          const fs=require('fs');
          const receipt=JSON.parse(fs.readFileSync('deployment/pre57/PROFILE_CURRENTNESS_EXECUTION__PRE57.json','utf8'));
          if(receipt.release!==process.env.RELEASE||receipt.marker!==process.env.RELEASE_MARKER)process.exit(1);
          if(receipt.summary?.protectedRecordsAttempted!==30||receipt.summary?.officialCredentialMatchesCompleted!==0)process.exit(1);
          if(Object.values(receipt.consequentialActionGates||{}).some(value=>value===true))process.exit(1);
          NODE

      - name: Revalidate exact source before provider mutation
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/check-pre52-data-continuity.js
          node scripts/check-pre57-production-startup.js
          npm --prefix .runtime/smarter-justice-v1.7.98 run deployment:doctor
          npm --prefix .runtime/smarter-justice-v1.7.98 run deployment:validate

      - name: Require protected provider credential and exact service preflight
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_EVIDENCE_PATH: ${{ runner.temp }}/render-provider-control.jsonl
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          node scripts/render-deploy-control-pre54.js service-preflight

      - name: Request exact pre57 deployment through Render API
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_EVIDENCE_PATH: ${{ runner.temp }}/render-provider-control.jsonl
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const token=String(process.env.RENDER_API_KEY||'').trim();
          const serviceId=process.env.RENDER_SERVICE_ID;
          const targetSha=process.env.TARGET_SHA;
          if(!token)throw new Error('Protected Render credential is unavailable');
          const response=await fetch(`https://api.render.com/v1/services/${serviceId}/deploys`,{
            method:'POST',
            headers:{Accept:'application/json',Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
            body:JSON.stringify({clearCache:'do_not_clear',commitId:targetSha}),
            signal:AbortSignal.timeout(30000)
          });
          if(![201,202].includes(response.status))throw new Error(`Render API ${response.status} while creating exact deploy`);
          const parsed=JSON.parse(await response.text());
          const deploy=parsed&&typeof parsed.deploy==='object'?parsed.deploy:parsed;
          const deployId=String(deploy.id||'');
          if(!/^dep-[a-z0-9]+$/i.test(deployId))throw new Error('Render deploy id is invalid');
          const returnedCommit=String(deploy.commit?.id||deploy.commitId||'');
          if(returnedCommit&&returnedCommit!==targetSha)throw new Error('Render returned a different commit');
          fs.appendFileSync(process.env.GITHUB_ENV,`RENDER_DEPLOY_ID=${deployId}\n`,'utf8');
          const row={at:new Date().toISOString(),kind:'provider_api_deploy_created',release:process.env.RELEASE,serviceId,deployId,status:deploy.status||'created',commitId:returnedCommit||targetSha,credentialMaterialPresent:false};
          fs.appendFileSync(process.env.RENDER_DEPLOY_EVIDENCE_PATH,`${JSON.stringify(row)}\n`,{encoding:'utf8',mode:0o600});
          console.log(JSON.stringify(row));
          NODE

      - name: Require exact provider terminal-live status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_EVIDENCE_PATH: ${{ runner.temp }}/render-provider-control.jsonl
        run: node scripts/render-deploy-control-pre54.js observe

      - name: Require both-domain pre57 identity, privacy boundary, held routes, and public UX
        shell: bash
        env:
          RENDER_BASE_URL: https://smarter-justice-app.onrender.com
          PUBLIC_BASE_URL: https://smarterjustice.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 96); do
            stamp="${TARGET_SHA}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error --max-time 20 "$RENDER_BASE_URL/api/release-identity?sj_release_probe=$stamp" > "$RUNNER_TEMP/origin-identity.json" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/api/release-identity?sj_release_probe=$stamp" > "$RUNNER_TEMP/public-identity.json" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/api/public/private-measurement/status?sj_release_probe=$stamp" > "$RUNNER_TEMP/measurement-status.json" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/?sj_release_probe=$stamp" > "$RUNNER_TEMP/home.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/navigator?sj_release_probe=$stamp" > "$RUNNER_TEMP/navigator.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/professionals.html?sj_release_probe=$stamp" > "$RUNNER_TEMP/professionals.html" \
              && curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/attorney-partner-tour.html?sj_release_probe=$stamp" > "$RUNNER_TEMP/attorney-tour.html"; then
              held_growth="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$PUBLIC_BASE_URL/growth-operations-compliance.html?sj_release_probe=$stamp" || true)"
              held_portals="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$PUBLIC_BASE_URL/portals.html?sj_release_probe=$stamp" || true)"
              if [ "$held_growth" = 404 ] && [ "$held_portals" = 404 ] && ROOT="$RUNNER_TEMP" node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.ROOT,read=name=>fs.readFileSync(path.join(root,name),'utf8');
          for(const name of ['origin-identity.json','public-identity.json']){
            const id=JSON.parse(read(name));
            if(id.release!==process.env.RELEASE||id.demoPathRelease!=='v2.0.0-pre52'||id.deploymentControlRelease!==process.env.RELEASE||id.gitCommit!==process.env.TARGET_SHA||id.marker!==process.env.RELEASE_MARKER)process.exit(1);
          }
          const status=JSON.parse(read('measurement-status.json'));
          if(status.consentRequired!==true||status.defaultConsent!=='not-granted'||status.retentionDays!==30||status.measurementBoundary?.thirdPartyTrackers!==false)process.exit(1);
          if(!/Start with what happened/i.test(read('home.html'))||!/Navigator/i.test(read('navigator.html'))||!/Smarter Justice Profile Lookup/i.test(read('professionals.html'))||!/Attorney Partner Tour/i.test(read('attorney-tour.html')))process.exit(1);
          NODE
              then
                exit 0
              fi
            fi
            sleep 10
          done
          exit 1

      - name: Provider-native rollback to exact accepted-live pre54 after failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_ACCEPTED_LIVE_DEPLOY_ID: ${{ env.LAST_ACCEPTED_LIVE_DEPLOY_ID }}
          RENDER_ACCEPTED_LIVE_SHA: ${{ env.LAST_ACCEPTED_LIVE_SHA }}
          RENDER_DEPLOY_EVIDENCE_PATH: ${{ runner.temp }}/render-rollback-control.jsonl
        run: node scripts/render-deploy-control-pre54.js rollback

      - name: Upload immutable pre57 deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-pre57-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/render-provider-control.jsonl
            ${{ runner.temp }}/origin-identity.json
            ${{ runner.temp }}/public-identity.json
            ${{ runner.temp }}/measurement-status.json
            ${{ runner.temp }}/home.html
            ${{ runner.temp }}/navigator.html
            ${{ runner.temp }}/professionals.html
            ${{ runner.temp }}/attorney-tour.html
            ${{ runner.temp }}/render-rollback-control.jsonl
          if-no-files-found: warn
          retention-days: 90

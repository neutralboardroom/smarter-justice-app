name: One-time v1.7.83 evidence inventory regenerator

on:
  push:
    branches:
      - agent/v1.7.83-live-smoke-contract-fix
    paths:
      - .github/workflows/one-time-v1783-evidence-inventory-regenerator.yml

permissions:
  contents: write

jobs:
  regenerate-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/v1.7.83-live-smoke-contract-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Verify time-relative evidence tests and regenerate inventories
        shell: bash
        run: |
          set -euo pipefail
          TEMP_ROOT="$(mktemp -d)"
          git archive HEAD | tar -x -C "$TEMP_ROOT"
          rm -f "$TEMP_ROOT/.github/workflows/one-time-v1783-evidence-inventory-regenerator.yml"

          cd "$TEMP_ROOT"
          node tests/v14-live-evidence-connector-v1780.test.js
          node tests/v14-evidence-batch-workspace-v1781.test.js
          node tests/v14-evidence-readiness-planner-v1782.test.js
          node tests/v14-evidence-collection-packet-v1783.test.js
          node <<'NODE'
          'use strict';
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const root=process.cwd();
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          function walk(dir=root){
            const out=[];
            function visit(current){
              for(const name of fs.readdirSync(current).sort((a,b)=>a.localeCompare(b))){
                const full=path.join(current,name);
                const rel=path.relative(root,full).split(path.sep).join('/');
                const st=fs.lstatSync(full);
                if(st.isSymbolicLink())throw new Error(`symlink:${rel}`);
                if(st.isDirectory())visit(full);
                else if(st.isFile())out.push(rel);
              }
            }
            visit(dir);
            return out;
          }
          function inventory(exclusions){
            const excluded=new Set(exclusions);
            return walk().filter(p=>!excluded.has(p)).sort((a,b)=>a.localeCompare(b)).map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`).join('\n')+'\n';
          }
          const payload=inventory(['OWNER_RECEIPT.txt','RELEASE_PAYLOAD_INVENTORY_SHA256.txt','FILE_INVENTORY_SHA256.txt']);
          fs.writeFileSync('RELEASE_PAYLOAD_INVENTORY_SHA256.txt',payload);
          let owner=fs.readFileSync('OWNER_RECEIPT.txt','utf8');
          owner=owner.replace(/^RELEASE_PAYLOAD_INVENTORY_SHA256:.*$/m,`RELEASE_PAYLOAD_INVENTORY_SHA256: ${sha(Buffer.from(payload))}`);
          owner=owner.replace(/^RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT:.*$/m,`RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT: ${payload.trimEnd().split('\n').filter(Boolean).length}`);
          fs.writeFileSync('OWNER_RECEIPT.txt',owner);
          const legacy=inventory(['FILE_INVENTORY_SHA256.txt']);
          fs.writeFileSync('FILE_INVENTORY_SHA256.txt',legacy);
          NODE

          node scripts/generate-v14-release-receipts.js --check
          node <<'NODE'
          'use strict';
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const root=process.cwd();
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const files=[];
          (function visit(dir){for(const name of fs.readdirSync(dir).sort((a,b)=>a.localeCompare(b))){const full=path.join(dir,name),rel=path.relative(root,full).split(path.sep).join('/'),st=fs.lstatSync(full);if(st.isSymbolicLink())throw new Error(`symlink:${rel}`);if(st.isDirectory())visit(full);else if(st.isFile()&&rel!=='FILE_INVENTORY_SHA256.txt')files.push(rel);}})(root);
          const expected=files.sort((a,b)=>a.localeCompare(b)).map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`).join('\n')+'\n';
          if(fs.readFileSync('FILE_INVENTORY_SHA256.txt','utf8')!==expected)throw new Error('legacy-inventory-drift');
          console.log(`legacy inventory check passed (${files.length} records)`);
          NODE

          cp RELEASE_PAYLOAD_INVENTORY_SHA256.txt "$GITHUB_WORKSPACE/RELEASE_PAYLOAD_INVENTORY_SHA256.txt"
          cp FILE_INVENTORY_SHA256.txt "$GITHUB_WORKSPACE/FILE_INVENTORY_SHA256.txt"
          cp OWNER_RECEIPT.txt "$GITHUB_WORKSPACE/OWNER_RECEIPT.txt"

          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/one-time-v1783-evidence-inventory-regenerator.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RELEASE_PAYLOAD_INVENTORY_SHA256.txt FILE_INVENTORY_SHA256.txt OWNER_RECEIPT.txt .github/workflows/one-time-v1783-evidence-inventory-regenerator.yml
          git commit -m "Regenerate exact inventories after evidence clock fixes"
          git push origin HEAD:agent/v1.7.83-live-smoke-contract-fix

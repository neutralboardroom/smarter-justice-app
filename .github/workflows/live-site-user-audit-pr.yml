name: Live production user audit gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarter-justice-live-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-user-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRIMARY_URL: https://www.smarterjustice.com
      APEX_URL: https://smarterjustice.com
      MAX_PAGES: '250'
    steps:
      - name: Checkout exact audit source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Install pinned browser audit dependencies
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/sj-live-audit"
          mkdir -p "$audit"
          cd "$audit"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Audit uncached production pages, controls, layouts, and funnels
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/sj-live-audit-output
          NODE_PATH: ${{ runner.temp }}/sj-live-audit/node_modules
        run: node .github/scripts/live-user-audit.mjs

      - name: Publish audit summary
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/sj-live-audit-output/live-user-audit.json"
          if [ -f "$report" ]; then
            node - "$report" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync(process.argv[2]));
          console.log('# Smarter Justice live production user audit');
          console.log(`- Pages visited: ${result.stats.pagesVisited}`);
          console.log(`- Links inspected: ${result.stats.linksInspected}`);
          console.log(`- Buttons inspected: ${result.stats.buttonsInspected}`);
          console.log(`- Forms inspected: ${result.stats.formsInspected}`);
          console.log(`- Critical findings: ${result.stats.criticalCount}`);
          console.log(`- Warnings: ${result.stats.warningCount}`);
          NODE
          fi

      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-live-user-audit-${{ github.sha }}
          path: ${{ runner.temp }}/sj-live-audit-output
          if-no-files-found: error
          retention-days: 14

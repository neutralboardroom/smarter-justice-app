name: Regenerate Smarter Justice production overlay inventories

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/regenerate-production-overlay-inventories.yml'

permissions:
  contents: write

concurrency:
  group: smarter-justice-v1783-inventory-regeneration
  cancel-in-progress: false

jobs:
  regenerate-inventories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated release branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/v1.7.83-production-import-protected-deploy
          fetch-depth: 0
      - name: Regenerate non-self-referential inventories
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const root=process.cwd();
          const temporary='.github/workflows/regenerate-production-overlay-inventories.yml';
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          function walk(){
            const out=[];
            function visit(dir){
              for(const name of fs.readdirSync(dir).sort((a,b)=>a.localeCompare(b))){
                if(dir===root && name==='.git') continue;
                const full=path.join(dir,name);
                const rel=path.relative(root,full).split(path.sep).join('/');
                const st=fs.lstatSync(full);
                if(st.isSymbolicLink()) throw new Error(`symlink:${rel}`);
                if(st.isDirectory()) visit(full);
                else if(st.isFile()) out.push(rel);
              }
            }
            visit(root);
            return out;
          }
          const payloadExcluded=new Set([
            'OWNER_RECEIPT.txt',
            'RELEASE_PAYLOAD_INVENTORY_SHA256.txt',
            'FILE_INVENTORY_SHA256.txt',
            temporary
          ]);
          const payload=walk()
            .filter(p=>!payloadExcluded.has(p))
            .sort((a,b)=>a.localeCompare(b))
            .map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`)
            .join('\n')+'\n';
          fs.writeFileSync('RELEASE_PAYLOAD_INVENTORY_SHA256.txt',payload);
          const payloadSha=sha(Buffer.from(payload));
          const payloadRecords=payload.trimEnd().split('\n').filter(Boolean).length;
          let owner=fs.readFileSync('OWNER_RECEIPT.txt','utf8');
          owner=owner
            .replace(/^RELEASE_PAYLOAD_INVENTORY_SHA256:.*$/m,`RELEASE_PAYLOAD_INVENTORY_SHA256: ${payloadSha}`)
            .replace(/^RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT:.*$/m,`RELEASE_PAYLOAD_INVENTORY_RECORD_COUNT: ${payloadRecords}`)
            .replace(
              'SMARTER_JUSTICE_CENTRAL. Ordinary material dual-track V14 release; not a deployment authorization.',
              'SMARTER_JUSTICE_CENTRAL. Repository production-qualification overlay over the exact accepted v1.7.83 source; deployment still requires protected owner authorization.'
            );
          fs.writeFileSync('OWNER_RECEIPT.txt',owner);
          const fileInventory=walk()
            .filter(p=>p!=='FILE_INVENTORY_SHA256.txt' && p!==temporary)
            .sort((a,b)=>a.localeCompare(b))
            .map(p=>`${sha(fs.readFileSync(path.join(root,p)))}  ${p}`)
            .join('\n')+'\n';
          fs.writeFileSync('FILE_INVENTORY_SHA256.txt',fileInventory);
          const fileSha=sha(Buffer.from(fileInventory));
          const fileRecords=fileInventory.trimEnd().split('\n').filter(Boolean).length;
          const result={payloadSha,payloadRecords,fileSha,fileRecords};
          console.log(JSON.stringify(result,null,2));
          if(payloadSha!=='fe58265f9763061b446651eadf0ef267715b63779e7d781d1244175b325a91d3') throw new Error('Unexpected payload inventory identity.');
          if(payloadRecords!==3145) throw new Error('Unexpected payload inventory record count.');
          if(fileSha!=='b79982cc0fe574413c84eab8efe46debeeccb990337528ae76d28854b53baca2') throw new Error('Unexpected file inventory identity.');
          if(fileRecords!==3147) throw new Error('Unexpected file inventory record count.');
          NODE
      - name: Commit only regenerated receipt and inventories
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OWNER_RECEIPT.txt RELEASE_PAYLOAD_INVENTORY_SHA256.txt FILE_INVENTORY_SHA256.txt
          test -z "$(git diff --cached --name-only | grep -Ev '^(OWNER_RECEIPT.txt|RELEASE_PAYLOAD_INVENTORY_SHA256.txt|FILE_INVENTORY_SHA256.txt)$' || true)"
          git commit -m 'Regenerate exact v1.7.83 production overlay inventories'
          git push origin HEAD:agent/v1.7.83-production-import-protected-deploy

name: Universal pipeline self-test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/portfolio-exact-deploy/**'
      - '.github/actions/verify-staging-promotion/**'
      - '.github/workflows/portfolio-*.yml'
      - '.github/workflows/reusable-portfolio-qualification.yml'
      - '.github/workflows/universal-pipeline-self-test.yml'
      - 'deployment/product-deployment.json'
      - 'deployment/universal-pipeline/**'
      - 'scripts/test-*-owner-rule.js'
      - 'scripts/test-universal-pipeline.js'
  push:
    branches:
      - ops/universal-safe-deployment-v1
    paths:
      - '.github/actions/portfolio-exact-deploy/**'
      - '.github/actions/verify-staging-promotion/**'
      - '.github/workflows/portfolio-*.yml'
      - '.github/workflows/reusable-portfolio-qualification.yml'
      - '.github/workflows/universal-pipeline-self-test.yml'
      - 'deployment/product-deployment.json'
      - 'deployment/universal-pipeline/**'
      - 'scripts/test-*-owner-rule.js'
      - 'scripts/test-universal-pipeline.js'

permissions:
  contents: read

concurrency:
  group: universal-pipeline-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Validate universal pipeline foundation
        run: node scripts/test-universal-pipeline.js

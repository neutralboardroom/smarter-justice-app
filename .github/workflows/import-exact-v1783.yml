name: Import exact Smarter Justice v1.7.83 source

on:
  push:
    branches:
      - agent/v1.7.83-production-import-protected-deploy
    paths:
      - 'smarter-justice-v1.7.83*.zip'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/import-exact-v1783.yml'
      - 'smarter-justice-v1.7.83*.zip'

permissions:
  contents: write
  actions: read

concurrency:
  group: smarter-justice-v1783-exact-import
  cancel-in-progress: false

jobs:
  import-exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated import branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/v1.7.83-production-import-protected-deploy
          fetch-depth: 0

      - name: Locate and bind exact uploaded archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -maxdepth 1 -type f -name 'smarter-justice-v1.7.83*.zip' -print | sort)
          test "${#files[@]}" -eq 1
          archive="${files[0]}"
          test "$(stat -c%s "$archive")" = "8888322"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "41eff94948e36b79ff5cf7e5d2b25c9bf145935cad5980c034c0b39254d4dbfc"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP structure and exact source inventory
        id: validate
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/smarter-justice-v1.7.83-source"
          acceptance="$RUNNER_TEMP/smarter-justice-v1.7.83-acceptance"
          report="$RUNNER_TEMP/smarter-justice-v1.7.83-import-verification.json"
          rm -rf "$stage" "$acceptance"
          mkdir -p "$stage"
          python3 - "$ARCHIVE" "$stage" "$report" <<'PY'
          import hashlib, json, pathlib, stat, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          stage = pathlib.Path(sys.argv[2])
          report_path = pathlib.Path(sys.argv[3])
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              names = [i.filename for i in infos]
              duplicates = sorted({n for n in names if names.count(n) > 1})
              unsafe = []
              symlinks = []
              for info in infos:
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      unsafe.append(info.filename)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      symlinks.append(info.filename)
              if duplicates or unsafe or symlinks:
                  raise SystemExit(f'Unsafe archive: duplicates={duplicates[:5]} unsafe={unsafe[:5]} symlinks={symlinks[:5]}')
              if len(infos) != 3171:
                  raise SystemExit(f'Unexpected ZIP entry count: {len(infos)}')
              if sum(not i.is_dir() for i in infos) != 3147:
                  raise SystemExit('Unexpected packaged file count')
              if sum(i.is_dir() for i in infos) != 24:
                  raise SystemExit('Unexpected explicit directory count')
              z.extractall(stage)
          package = json.loads((stage / 'package.json').read_text(encoding='utf-8'))
          if package.get('version') != '1.7.83':
              raise SystemExit('package.json is not version 1.7.83')
          inventory = stage / 'FILE_INVENTORY_SHA256.txt'
          records = []
          for line in inventory.read_text(encoding='utf-8').splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              expected, rel = line.split('  ', 1)
              records.append((expected, rel))
          if len(records) != 3146:
              raise SystemExit(f'Unexpected inventory record count: {len(records)}')
          missing = []
          mismatched = []
          for expected, rel in records:
              path = stage / rel
              if not path.is_file():
                  missing.append(rel)
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  mismatched.append({'path': rel, 'expected': expected, 'actual': actual})
          if missing or mismatched:
              raise SystemExit(f'Inventory failure: missing={missing[:5]} mismatched={mismatched[:3]}')
          server_text = (stage / 'server.js').read_text(encoding='utf-8')
          if "const VERSION = '1.7.83';" not in server_text:
              raise SystemExit('server.js version identity mismatch')
          report = {
              'ok': True,
              'archive': archive.name,
              'archiveSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'archiveBytes': archive.stat().st_size,
              'zipEntries': 3171,
              'packagedFiles': 3147,
              'explicitDirectories': 24,
              'inventoryRecords': len(records),
              'inventorySha256': hashlib.sha256(inventory.read_bytes()).hexdigest(),
              'packageVersion': package['version'],
              'unsafePaths': 0,
              'duplicateEntries': 0,
              'symlinks': 0
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
          cp -a "$stage" "$acceptance"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "acceptance=$acceptance" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Install dependencies outside source tree
        id: dependencies
        env:
          SOURCE: ${{ steps.validate.outputs.acceptance }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/smarter-justice-v1.7.83-dependencies"
          rm -rf "$deps"
          mkdir -p "$deps"
          cp "$SOURCE/package.json" "$SOURCE/package-lock.json" "$deps/"
          npm ci --prefix "$deps" --no-audit
          echo "node_path=$deps/node_modules" >> "$GITHUB_OUTPUT"

      - name: Run complete clean-source acceptance
        working-directory: ${{ steps.validate.outputs.acceptance }}
        env:
          NODE_PATH: ${{ steps.dependencies.outputs.node_path }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          ORIGINAL_SOURCE: ${{ steps.validate.outputs.stage }}
        run: |
          set -euo pipefail
          npm test
          npm run sbom
          npm run deployment:validate
          npm run v14:validate
          npm run v14:receipts
          npm run v14:acceptance-evidence-bundle
          node tests/v14-release-receipt-automation-v1780.test.js
          diff -qr "$ORIGINAL_SOURCE" .

      - name: Upload exact import evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-v1.7.83-exact-import-evidence
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.validate.outputs.report }}
            ${{ steps.validate.outputs.acceptance }}/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Replace branch with exact accepted source and self-remove importer
        env:
          STAGE: ${{ steps.validate.outputs.stage }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$STAGE"/. .
          test "$(node -p "require('./package.json').version")" = "1.7.83"
          test "$(sha256sum FILE_INVENTORY_SHA256.txt | cut -d' ' -f1)" = "cfbf49c89af963d0ea7d7a9bed25cda3a6a2652e93dc6a8c021b72b9c05d7a8c"
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('.')
          records = []
          for line in (root / 'FILE_INVENTORY_SHA256.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              expected, rel = line.split('  ', 1)
              records.append((expected, rel))
          assert len(records) == 3146
          for expected, rel in records:
              path = root / rel
              assert path.is_file(), rel
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, rel
          print('Exact source inventory reverified after import staging.')
          PY
          test ! -e .github/workflows/import-exact-v1783.yml
          test -z "$(find . -maxdepth 1 -type f -name 'smarter-justice-v1.7.83*.zip' -print -quit)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Exact import produced no changes.'; exit 1; }
          git commit -m 'Import exact Smarter Justice v1.7.83 source'
          git push origin HEAD:agent/v1.7.83-production-import-protected-deploy

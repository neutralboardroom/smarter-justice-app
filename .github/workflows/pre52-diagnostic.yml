name: Pre52 diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Run clean bootstrap and capture exact failure
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/pre52-diagnostic.log" 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            npm run postinstall >> "$RUNNER_TEMP/pre52-diagnostic.log" 2>&1
            test_status=$?
          else
            test_status=$install_status
          fi
          echo "--- SURVIVING FUTURE-FEATURE LANGUAGE ---" >> "$RUNNER_TEMP/pre52-diagnostic.log"
          grep -Rni -C 2 -E 'full nationwide marketing-compliance automation|unrestricted outbound campaigns|AI front[- ]desk|automatic CRM migration' .runtime/smarter-justice-v1.7.98/public >> "$RUNNER_TEMP/pre52-diagnostic.log" 2>&1 || true
          echo "--- ATTORNEY STEP 5 LABELS ---" >> "$RUNNER_TEMP/pre52-diagnostic.log"
          grep -n -E '5\. (Operations|Firm workspace|Working today)' .runtime/smarter-justice-v1.7.98/public/attorney-partner-tour.html >> "$RUNNER_TEMP/pre52-diagnostic.log" 2>&1 || true
          echo "EXIT_STATUS=$test_status" >> "$RUNNER_TEMP/pre52-diagnostic.log"
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre52-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/pre52-diagnostic.log
          if-no-files-found: error
          retention-days: 1

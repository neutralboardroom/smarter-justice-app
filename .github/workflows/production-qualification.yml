name: Production qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Reconstruct and hash-verify qualified v1.7.101 runtime
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --no-fund
          test "$(node -p "require('./package.json').version")" = "1.7.101"
          test "$(node -p "require('./.runtime/smarter-justice-v1.7.101/package.json').version")" = "1.7.101"
      - name: Verify focused V43 public UX acceptance
        run: npm run test:runtime:v43
      - name: Verify reconstructed runtime smoke suite
        run: npm run test:runtime:smoke
      - name: Verify reconstructed static safeguards
        run: npm run test:runtime:static
      - name: Verify runtime syntax and migration invariance
        run: |
          set -euo pipefail
          node --check .runtime/smarter-justice-v1.7.101/server.js
          printf '%s  %s\n' '6cf12a4264da41487c6d9c792369eee19e1c576caeb7d8228b7461f2cacbe878' '.runtime/smarter-justice-v1.7.101/migrations/postgres.sql' | sha256sum -c -
          printf '%s  %s\n' '6bd946ad8a2845d036c7037b80a493ca663d0ecd529b838f1c984831c1e68727' '.runtime/smarter-justice-v1.7.101/scripts/run-migrations.js' | sha256sum -c -
      - name: Verify deployment authorization and carrier identity
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const auth=JSON.parse(fs.readFileSync('deployment/AUTONOMOUS_DEPLOYMENT_AUTHORIZATION_V1.7.101.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('release-delta/v17101-runtime-manifest.json','utf8'));
          if(auth.status!=='AUTHORIZED'||auth.targetVersion!=='1.7.101'||auth.technicalDeploymentAuthorized!==true)process.exit(1);
          if(manifest.targetVersion!=='1.7.101')process.exit(1);
          if(manifest.targetArtifactSha256!=='af4523a2d2b9635dd8824141d7e2e4aac9327f28d7ce56d7f2fa50429d2a158e')process.exit(1);
          if(manifest.patchedFiles < 121)process.exit(1);
          NODE

  qualification-gate:
    if: ${{ always() }}
    needs: [qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Require qualification success
        env:
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$RESULT" = "success" || {
            echo "Qualification did not succeed: $RESULT"
            exit 1
          }

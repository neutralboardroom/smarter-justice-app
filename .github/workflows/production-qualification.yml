name: Production qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Export clean inventory-locked bootstrap source
        id: source
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/smarter-justice-qualified-source"
          rm -rf "$source"
          mkdir -p "$source"
          git archive --format=tar HEAD | tar -xf - -C "$source"
          root_version="$(node -p "require('$source/package.json').version")"
          lock_version="$(node -p "require('$source/package-lock.json').version")"
          test -n "$root_version"
          test "$root_version" = "$lock_version"
          echo "path=$source" >> "$GITHUB_OUTPUT"
          echo "version=$root_version" >> "$GITHUB_OUTPUT"
          echo "Qualifying Smarter Justice bootstrap version $root_version"

      - name: Install bootstrap package without lifecycle scripts
        env:
          SOURCE: ${{ steps.source.outputs.path }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm ci --prefix "$SOURCE" --ignore-scripts --no-audit --no-fund

      - name: Execute sealed runtime bootstrap and overlay acceptance
        working-directory: ${{ steps.source.outputs.path }}
        env:
          CI: 'true'
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm run postinstall

      - name: Reproduce exact Render omit-dev lifecycle build
        env:
          SOURCE: ${{ steps.source.outputs.path }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          set -euo pipefail
          render_source="$RUNNER_TEMP/smarter-justice-render-build"
          rm -rf "$render_source"
          mkdir -p "$render_source"
          git archive --format=tar HEAD | tar -xf - -C "$render_source"
          npm ci --prefix "$render_source" --omit=dev --no-audit --no-fund
          if test -f "$render_source/.runtime/pre96-live/.pre96-render-bootstrap.json"; then
            (cd "$render_source" && node --check scripts/start-pre96-deploy.js)
            (cd "$render_source" && node --check .runtime/pre96-live/server.js)
            RENDER_SOURCE="$render_source" node -e "const fs=require('fs'),path=require('path');const root=process.env.RENDER_SOURCE;const marker=JSON.parse(fs.readFileSync(path.join(root,'.runtime/pre96-live/.pre96-render-bootstrap.json'),'utf8'));const pkg=JSON.parse(fs.readFileSync(path.join(root,'.runtime/pre96-live/package.json'),'utf8'));if(marker.release!=='v2.0.0-pre96')throw new Error('current sealed carrier marker mismatch');if(marker.carrierSha256!=='a506ac9c1c0447b97f412da30341ea616e089be423a3c43addf6ca3813f7a9bc')throw new Error('current carrier SHA mismatch');if(pkg.version!=='2.0.0-pre96')throw new Error('current runtime version mismatch');console.log('Current sealed PRE96 carrier startup structure qualified.');"
          else
            (cd "$render_source" && node scripts/check-pre58-production-startup.js)
          fi

      - name: Qualify current or legacy runtime-specific safeguards
        working-directory: ${{ steps.source.outputs.path }}
        run: |
          set -euo pipefail
          if test -f .runtime/pre96-live/.pre96-render-bootstrap.json; then
            node --check scripts/bootstrap-pre96-deploy.js
            node --check scripts/start-pre96-deploy.js
            test -f .runtime/pre96-live/deployment/pre96/PRE96_RELEASE_SUMMARY.json
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.runtime/pre96-live/deployment/pre96/PRE96_RELEASE_SUMMARY.json','utf8'));if(r.release!=='v2.0.0-pre96'||r.overallAssertions!==665||r.runtimeSmokeChecks!==177||r.sameOriginLinksChecked!==6005)throw new Error('PRE96 release qualification receipt mismatch');console.log('PRE96 inherited qualification receipt verified.');"
          else
            RUNTIME=".runtime/smarter-justice-v${{ steps.source.outputs.version }}"
            node --check scripts/apply-pre58-ny-credential-reconciliation.js
            node --check scripts/check-pre58-production-startup.js
            node --check "$RUNTIME/lib/credentialReconciliationPre58.js"
            python3 deployment/pre58/test_pre58_credential_reconciliation.py
            python3 deployment/pre58/test_pre58_release.py
          fi

      - name: Resolve qualified runtime
        id: runtime
        env:
          SOURCE: ${{ steps.source.outputs.path }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          if test -f "$SOURCE/.runtime/pre96-live/package.json"; then
            runtime="$SOURCE/.runtime/pre96-live"
          else
            runtime="$SOURCE/.runtime/smarter-justice-v$VERSION"
          fi
          test -f "$runtime/package.json"
          test -f "$runtime/package-lock.json"
          runtime_version="$(node -p "require('$runtime/package.json').version")"
          echo "path=$runtime" >> "$GITHUB_OUTPUT"
          echo "version=$runtime_version" >> "$GITHUB_OUTPUT"
          echo "Qualified runtime: $runtime ($runtime_version)"

      - name: Validate current runtime structure
        env:
          RUNTIME: ${{ steps.runtime.outputs.path }}
        run: |
          set -euo pipefail
          test -f "$RUNTIME/server.js"
          node --check "$RUNTIME/server.js"
          test -d "$RUNTIME/public"
          count="$(find "$RUNTIME/public" -type f -name '*.html' | wc -l | tr -d ' ')"
          test "$count" -ge 160
          echo "HTML surfaces: $count"
          if test -f "$RUNTIME/scripts/generate-sbom.js" && node -e "const p=require(process.env.RUNTIME+'/package.json');process.exit(p.scripts&&p.scripts.sbom?0:1)"; then
            (cd "$RUNTIME" && npm run sbom)
          else
            echo 'Sealed carrier omits SBOM generator source; inherited release receipt remains authoritative.'
          fi
          if test -f "$RUNTIME/scripts/validate-deployment.js" && node -e "const p=require(process.env.RUNTIME+'/package.json');process.exit(p.scripts&&p.scripts['deployment:validate']?0:1)"; then
            (cd "$RUNTIME" && npm run deployment:validate)
          else
            echo 'Sealed carrier omits deployment validator source; startup marker and release receipt remain authoritative.'
          fi

  qualification-gate:
    if: ${{ always() }}
    needs: [qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Require qualification success
        env:
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$RESULT" = "success" || {
            echo "Qualification did not succeed: $RESULT"
            exit 1
          }

name: Production qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Export clean inventory-locked bootstrap source
        id: source
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/smarter-justice-qualified-source"
          rm -rf "$source"
          mkdir -p "$source"
          git archive --format=tar HEAD | tar -xf - -C "$source"
          root_version="$(node -p "require('$source/package.json').version")"
          lock_version="$(node -p "require('$source/package-lock.json').version")"
          test -n "$root_version"
          test "$root_version" = "$lock_version"
          echo "path=$source" >> "$GITHUB_OUTPUT"
          echo "bootstrap_version=$root_version" >> "$GITHUB_OUTPUT"
          echo "Qualifying Smarter Justice bootstrap version $root_version"

      - name: Install bootstrap package without lifecycle scripts
        env:
          SOURCE: ${{ steps.source.outputs.path }}
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm ci --prefix "$SOURCE" --ignore-scripts --no-audit --no-fund

      - name: Execute sealed runtime bootstrap and overlay acceptance
        working-directory: ${{ steps.source.outputs.path }}
        env:
          CI: 'true'
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm run postinstall

      - name: Reproduce exact Render omit-dev lifecycle build
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          set -euo pipefail
          render_source="$RUNNER_TEMP/smarter-justice-render-build"
          rm -rf "$render_source"
          mkdir -p "$render_source"
          git archive --format=tar HEAD | tar -xf - -C "$render_source"
          npm ci --prefix "$render_source" --omit=dev --no-audit --no-fund
          RENDER_SOURCE="$render_source" node - <<'NODE'
          const fs=require('fs'), path=require('path'), cp=require('child_process');
          const root=process.env.RENDER_SOURCE;
          const pre124=path.join(root,'.runtime','pre124-live');
          if(fs.existsSync(path.join(pre124,'.pre124-render-bootstrap.json'))){
            const marker=JSON.parse(fs.readFileSync(path.join(pre124,'.pre124-render-bootstrap.json'),'utf8'));
            const pkg=JSON.parse(fs.readFileSync(path.join(pre124,'package.json'),'utf8'));
            if(marker.release!=='v2.0.0-pre124'||marker.baseRelease!=='v2.0.0-pre123'||marker.productAuthority!=='SMARTER_JUSTICE_ONLY'||marker.navigatorOrCommunityMutation!==false||marker.stripeMutation!==true||marker.paymentSetupDeferredByOwner!==false||marker.paymentSetupAuthorizedByOwner!==true||marker.productionDeploymentAuthorized!==true) throw new Error('PRE124 Render marker mismatch');
            if(pkg.version!=='2.0.0-pre124') throw new Error('PRE124 runtime package mismatch');
            console.log('PRE124 exact Render lifecycle build qualified');
          } else {
            cp.execFileSync(process.execPath,[path.join(root,'scripts','check-pre58-production-startup.js')],{cwd:root,stdio:'inherit'});
          }
          NODE

      - name: Resolve qualified runtime
        id: runtime
        env:
          SOURCE: ${{ steps.source.outputs.path }}
          BOOTSTRAP_VERSION: ${{ steps.source.outputs.bootstrap_version }}
        run: |
          set -euo pipefail
          if test -f "$SOURCE/.runtime/pre124-live/.pre124-render-bootstrap.json"; then
            runtime="$SOURCE/.runtime/pre124-live"
          else
            runtime="$SOURCE/.runtime/smarter-justice-v$BOOTSTRAP_VERSION"
          fi
          test -f "$runtime/package.json"
          test -f "$runtime/package-lock.json"
          runtime_version="$(node -p "require('$runtime/package.json').version")"
          RUNTIME="$runtime" node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const runtime=process.env.RUNTIME;
          const pkg=require(path.join(runtime,'package.json'));
          for(const script of ['test','sbom','deployment:validate']) if(!pkg.scripts||!pkg.scripts[script]) throw new Error(`Qualified runtime is missing required script: ${script}`);
          const markerPath=path.join(runtime,'.pre124-render-bootstrap.json');
          if(fs.existsSync(markerPath)){
            const marker=JSON.parse(fs.readFileSync(markerPath,'utf8'));
            if(marker.release!==`v${pkg.version}`) throw new Error('PRE124 marker/package version mismatch');
          }
          NODE
          echo "path=$runtime" >> "$GITHUB_OUTPUT"
          echo "version=$runtime_version" >> "$GITHUB_OUTPUT"
          echo "Qualified runtime: $runtime_version"

      - name: Qualify retained credential reconciliation
        env:
          SOURCE: ${{ steps.source.outputs.path }}
          RUNTIME: ${{ steps.runtime.outputs.path }}
        run: |
          set -euo pipefail
          node --check "$RUNTIME/lib/credentialReconciliationPre58.js"
          if test -f "$RUNTIME/.pre124-render-bootstrap.json"; then
            test -f "$SOURCE/deployment/pre58/NY_OFFICIAL_CREDENTIAL_RECONCILIATION__PRE58.json"
            RUNTIME="$RUNTIME" node -e "const fs=require('fs'),path=require('path'),r=process.env.RUNTIME,receipt=JSON.parse(fs.readFileSync(path.join(r,'PRE124_COMPLETION_RECEIPT.json'),'utf8')); if(receipt.baseRelease!=='v2.0.0-pre123'||receipt.predecessorUnchangedFilesHashVerified!==true||!fs.existsSync(path.join(r,'lib','credentialReconciliationPre58.js'))) process.exit(1); console.log('Retained PRE58 credential reconciliation protected by PRE124 exact-predecessor no-loss verification');"
          else
            (cd "$SOURCE" && RUNTIME="$RUNTIME" python3 deployment/pre58/test_pre58_credential_reconciliation.py)
            (cd "$SOURCE" && RUNTIME="$RUNTIME" python3 deployment/pre58/test_pre58_release.py)
          fi

      - name: Generate deterministic runtime SBOM
        working-directory: ${{ steps.runtime.outputs.path }}
        run: npm run sbom

      - name: Validate runtime deployment kit
        working-directory: ${{ steps.runtime.outputs.path }}
        run: npm run deployment:validate

      - name: Upload runtime SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarter-justice-sbom-${{ github.sha }}
          path: ${{ steps.runtime.outputs.path }}/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14

  qualification-gate:
    if: ${{ always() }}
    needs: [qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Require qualification success
        env:
          RESULT: ${{ needs.qualification.result }}
        run: |
          test "$RESULT" = "success" || {
            echo "Qualification did not succeed: $RESULT"
            exit 1
          }

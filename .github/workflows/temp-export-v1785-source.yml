name: Temporary v1.7.85 source export

on:
  push:
    branches:
      - release/v1.7.85-all-portals
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Create exact source archive
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/smarter-justice-v1785-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/smarter-justice-v1785-source.tar.gz" > "$RUNNER_TEMP/smarter-justice-v1785-source.tar.gz.sha256"
      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smarter-justice-v1785-exact-source
          path: |
            ${{ runner.temp }}/smarter-justice-v1785-source.tar.gz
            ${{ runner.temp }}/smarter-justice-v1785-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

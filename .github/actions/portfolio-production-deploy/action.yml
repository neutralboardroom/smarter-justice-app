name: Smarter Justice portfolio exact-commit production deployment
description: Deploys one previously qualified exact commit through a protected portal-local GitHub environment and Render deploy hook.

inputs:
  config-path:
    description: Repository-relative product deployment configuration.
    required: false
    default: deployment/product-deployment.json
  target-sha:
    description: Exact qualified 40-character commit SHA.
    required: true
  target-version:
    description: Exact authorized product version.
    required: true
  authorization-id:
    description: Product-scoped owner authorization or approved automatic-release receipt ID.
    required: true
  migration-class:
    description: Accepted migration class.
    required: true
  backup-receipt-id:
    description: Current backup or restore-readiness receipt ID.
    required: true
  rollback-sha:
    description: Exact last-known-good application commit SHA.
    required: true
  rollback-version:
    description: Exact last-known-good application version.
    required: true
  public-base-url:
    description: HTTPS production origin without a trailing slash.
    required: true
  render-deploy-hook-url:
    description: Protected Render deploy hook supplied by the caller repository production environment.
    required: true
  github-token:
    description: Caller repository GitHub token used only to verify exact-commit qualification.
    required: true

outputs:
  deployed-sha:
    description: Exact commit verified live.
    value: ${{ steps.identity.outputs.sha }}
  deployed-version:
    description: Exact version verified live.
    value: ${{ steps.identity.outputs.version }}

runs:
  using: composite
  steps:
    - name: Validate authorization, rollback, and protected endpoint inputs
      shell: bash
      env:
        TARGET_SHA: ${{ inputs.target-sha }}
        TARGET_VERSION: ${{ inputs.target-version }}
        AUTHORIZATION_ID: ${{ inputs.authorization-id }}
        MIGRATION_CLASS: ${{ inputs.migration-class }}
        BACKUP_RECEIPT_ID: ${{ inputs.backup-receipt-id }}
        ROLLBACK_SHA: ${{ inputs.rollback-sha }}
        ROLLBACK_VERSION: ${{ inputs.rollback-version }}
        PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
        RENDER_DEPLOY_HOOK_URL: ${{ inputs.render-deploy-hook-url }}
      run: |
        set -euo pipefail
        printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
        printf '%s' "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{40}$'
        printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'
        printf '%s' "$ROLLBACK_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$'
        printf '%s' "$AUTHORIZATION_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
        printf '%s' "$BACKUP_RECEIPT_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
        case "$MIGRATION_CLASS" in
          NO_MIGRATION|BACKWARD_COMPATIBLE_EXPAND|STATEFUL_REVERSIBLE) ;;
          *) echo 'Rejected migration class'; exit 1 ;;
        esac
        test "$TARGET_SHA" != "$ROLLBACK_SHA"
        printf '%s' "$PUBLIC_BASE_URL" | grep -Eq '^https://[^/]+$'
        printf '%s' "$RENDER_DEPLOY_HOOK_URL" | grep -Eq '^https://api\.render\.com/deploy/'

    - name: Validate exact checked-out product and owner rules
      id: identity
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        TARGET_SHA: ${{ inputs.target-sha }}
        TARGET_VERSION: ${{ inputs.target-version }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$TARGET_SHA"
        test -f package.json
        test -f package-lock.json
        test -f "$CONFIG_PATH"
        test "$(node -p "require('./package.json').version")" = "$TARGET_VERSION"
        node - <<'NODE'
        const fs = require('fs');
        const c = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, 'utf8'));
        if (c.schemaVersion !== 1) throw new Error('Unsupported product deployment schema');
        if (c.repository !== process.env.GITHUB_REPOSITORY) throw new Error('Repository mismatch');
        if (JSON.stringify(c.localization?.requiredLocales) !== JSON.stringify(['en', 'es'])) throw new Error('English/Spanish parity rule missing');
        if (c.localization?.toggleRequired !== true || c.localization?.criticalJourneyReceiptRequired !== true) throw new Error('English/Español owner rule incomplete');
        for (const key of ['persistentStorageRequired','backupReceiptRequired','migrationClassRequired','rollbackMustPreserveNewData']) {
          if (c.dataContinuity?.[key] !== true) throw new Error(`Persistent-user-data owner rule missing: ${key}`);
        }
        for (const [name, value] of Object.entries(c.sensitiveCapabilities || {})) {
          if (!['CLOSED','VERIFIED_OPEN'].includes(value)) throw new Error(`Invalid sensitive capability state: ${name}`);
        }
        if (!Array.isArray(c.health?.paths) || c.health.paths.length < 1) throw new Error('At least one health path is required');
        if (!c.health.paths.every(p => typeof p === 'string' && p.startsWith('/'))) throw new Error('Invalid health path');
        if (!c.health.expectedProductName) throw new Error('Missing expected product name');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `paths_json=${JSON.stringify(c.health.paths)}\n`);
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_name=${c.health.expectedProductName}\n`);
        NODE
        test -z "$(git status --porcelain)"
        echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
        echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"

    - name: Require successful qualification for the exact commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET_SHA: ${{ inputs.target-sha }}
      run: |
        set -euo pipefail
        count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs" --jq '[.check_runs[] | select((.name | endswith("qualification-gate")) and .conclusion == "success")] | length')"
        test "$count" -ge 1

    - name: Capture pre-deployment health evidence
      shell: bash
      env:
        PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
      run: |
        set +e
        curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/health" > "$RUNNER_TEMP/pre-deploy-health.json"
        set -e

    - name: Request exact-commit Render deployment
      id: deploy_request
      shell: bash
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ inputs.render-deploy-hook-url }}
        TARGET_SHA: ${{ inputs.target-sha }}
      run: |
        set -euo pipefail
        sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
        curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${TARGET_SHA}" > "$RUNNER_TEMP/render-deploy-response.json"

    - name: Verify exact live version and required health paths
      shell: bash
      env:
        PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
        TARGET_VERSION: ${{ inputs.target-version }}
        PATHS_JSON: ${{ steps.identity.outputs.paths_json }}
        EXPECTED_NAME: ${{ steps.identity.outputs.expected_name }}
      run: |
        set -euo pipefail
        delay=10
        for attempt in $(seq 1 18); do
          echo "Live verification attempt $attempt"
          if node - <<'NODE'
        const {execFileSync}=require('child_process');
        const base=process.env.PUBLIC_BASE_URL;
        const version=process.env.TARGET_VERSION;
        const expected=process.env.EXPECTED_NAME;
        const paths=JSON.parse(process.env.PATHS_JSON);
        for(const p of paths){
          const raw=execFileSync('curl',['--fail','--silent','--show-error','--max-time','20',base+p],{encoding:'utf8'});
          const data=JSON.parse(raw);
          if(data.ok!==true) throw new Error(`${p} not ok`);
          if(data.version!==version) throw new Error(`${p} version mismatch`);
          if(data.app && data.app!==expected) throw new Error(`${p} product mismatch`);
        }
        NODE
          then
            echo 'Exact live verification succeeded.'
            exit 0
          fi
          sleep "$delay"
          if [ "$delay" -lt 60 ]; then delay=$((delay * 2)); [ "$delay" -gt 60 ] && delay=60; fi
        done
        exit 1

    - name: Restore last-known-good application commit after failed live verification
      if: ${{ failure() && steps.deploy_request.outcome == 'success' }}
      shell: bash
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ inputs.render-deploy-hook-url }}
        ROLLBACK_SHA: ${{ inputs.rollback-sha }}
        ROLLBACK_VERSION: ${{ inputs.rollback-version }}
        PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
        PATHS_JSON: ${{ steps.identity.outputs.paths_json }}
      run: |
        set -euo pipefail
        sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
        curl --fail --silent --show-error --location --max-time 30 "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${ROLLBACK_SHA}" > "$RUNNER_TEMP/render-rollback-response.json"
        delay=10
        for attempt in $(seq 1 18); do
          if PATHS_JSON="$PATHS_JSON" PUBLIC_BASE_URL="$PUBLIC_BASE_URL" ROLLBACK_VERSION="$ROLLBACK_VERSION" node - <<'NODE'
        const {execFileSync}=require('child_process');
        const base=process.env.PUBLIC_BASE_URL;
        const version=process.env.ROLLBACK_VERSION;
        const paths=JSON.parse(process.env.PATHS_JSON);
        for(const p of paths){
          const raw=execFileSync('curl',['--fail','--silent','--show-error','--max-time','20',base+p],{encoding:'utf8'});
          const data=JSON.parse(raw);
          if(data.ok!==true || data.version!==version) process.exit(1);
        }
        NODE
          then
            echo 'Last-known-good application commit restored.'
            exit 0
          fi
          sleep "$delay"
          if [ "$delay" -lt 60 ]; then delay=$((delay * 2)); [ "$delay" -gt 60 ] && delay=60; fi
        done
        echo 'CRITICAL: automatic application rollback could not be verified.'
        exit 1

    - name: Write successful production deployment receipt
      if: ${{ success() }}
      shell: bash
      env:
        TARGET_SHA: ${{ inputs.target-sha }}
        TARGET_VERSION: ${{ inputs.target-version }}
        AUTHORIZATION_ID: ${{ inputs.authorization-id }}
        BACKUP_RECEIPT_ID: ${{ inputs.backup-receipt-id }}
        MIGRATION_CLASS: ${{ inputs.migration-class }}
        ROLLBACK_SHA: ${{ inputs.rollback-sha }}
        ROLLBACK_VERSION: ${{ inputs.rollback-version }}
        PUBLIC_BASE_URL: ${{ inputs.public-base-url }}
      run: |
        node - <<'NODE'
        const fs=require('fs');
        const receipt={
          schemaVersion:1,
          repository:process.env.GITHUB_REPOSITORY,
          deployedSha:process.env.TARGET_SHA,
          deployedVersion:process.env.TARGET_VERSION,
          authorizationId:process.env.AUTHORIZATION_ID,
          backupReceiptId:process.env.BACKUP_RECEIPT_ID,
          migrationClass:process.env.MIGRATION_CLASS,
          rollbackSha:process.env.ROLLBACK_SHA,
          rollbackVersion:process.env.ROLLBACK_VERSION,
          publicBaseUrl:process.env.PUBLIC_BASE_URL,
          deployedAt:new Date().toISOString(),
          ownerRules:{persistentUserData:true,englishSpanishParity:true,failClosed:true}
        };
        fs.writeFileSync(process.env.RUNNER_TEMP+'/production-deployment-receipt.json',JSON.stringify(receipt,null,2)+'\n');
        NODE

    - name: Upload production evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: portfolio-production-evidence-${{ github.repository_id }}-${{ inputs.target-sha }}
        path: |
          ${{ runner.temp }}/pre-deploy-health.json
          ${{ runner.temp }}/render-deploy-response.json
          ${{ runner.temp }}/render-rollback-response.json
          ${{ runner.temp }}/production-deployment-receipt.json
        if-no-files-found: warn
        retention-days: 30
